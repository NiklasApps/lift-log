# XcodeGen spec (https://github.com/yonaskolb/XcodeGen): the Xcode project
# is generated from this file (`xcodegen generate`), not checked in, so the
# app can be edited without a Mac. CI builds it (.github/workflows/ios.yml).
name: LiftLog
options:
  bundleIdPrefix: de.niklasapps
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  LiftLog:
    type: application
    platform: iOS
    sources:
      - LiftLog
      # The web app itself, served to the web view by BundleSchemeHandler.
      - path: ../../liftlog.html
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        # Only HTTPS (exempt): no export compliance question per build.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.niklasapps.liftlog
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_CFBundleDisplayName: Lift Log
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    scheme: {}
