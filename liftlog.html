<!doctype html>
<meta charset="utf-8">
<title>Lift Log</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lift Log">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f1f4f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#08121e" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="liftlog-icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
<style>
/* Layout: one-column phone app; sticky view header, scrolling cards, fixed bottom tab bar.
   Brand (see brand/BRAND.md): navy #0D1B2B + volt lime #C7F431 from the app icon. Light: navy is the accent fill with lime ink.
   Dark: navy surfaces, lime is the accent fill with navy ink. Volt stays lime in both for "done" and "progress" moments. */
:root {
  --navy: #0d1b2b;
  --volt: #c7f431;
  --volt-ink: #0d1b2b;
  --volt-edge: #a8d415;
  --bg: #f1f4f8;
  --surface: #ffffff;
  --surface-2: #f2f5f8;
  --ink: #0d1b2b;
  --muted: #556275;
  --line: #d9e0e8;
  --accent: #0d1b2b;
  --accent-ink: #c7f431;
  --accent-soft: #eef9cc;
  --volt-soft: #eef9cc;
  --good: #16794a;
  --good-soft: #ddf2e6;
  --warn: #c2410c;
  --warn-soft: #fbe5da;
  --f-display: "Archivo", "Arial Black", "Helvetica Neue", sans-serif;
  --f-body: "Archivo", -apple-system, "Segoe UI", Roboto, sans-serif;
  --wd: 112%;
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #08121e; --surface: #0d1b2b; --surface-2: #132538; --ink: #eef3f8; --muted: #8d9cb0;
    --line: #1f3349; --accent: #c7f431; --accent-ink: #0d1b2b; --accent-soft: #27392c; --volt-soft: #27392c; --volt-edge: #c7f431;
    --good: #3ccb86; --good-soft: #12301f; --warn: #ff8a5c; --warn-soft: #3a1f17;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #08121e; --surface: #0d1b2b; --surface-2: #132538; --ink: #eef3f8; --muted: #8d9cb0;
  --line: #1f3349; --accent: #c7f431; --accent-ink: #0d1b2b; --accent-soft: #27392c; --volt-soft: #27392c; --volt-edge: #c7f431;
  --good: #3ccb86; --good-soft: #12301f; --warn: #ff8a5c; --warn-soft: #3a1f17;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); }
.topbar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px 10px; }
.topbar h1 { font-family: var(--f-display); font-stretch: var(--wd); font-weight: 800; font-size: 26px; letter-spacing: 0; margin: 0; text-transform: uppercase; line-height: 1; display: flex; align-items: center; gap: 10px; min-width: 0; }
.topbar h1 .mark { width: 30px; height: 30px; flex: none; }
.sync { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.sync.ok i { background: var(--good); }
.sync.busy i { background: var(--accent); }
.sync.err { color: var(--warn); } .sync.err i { background: var(--warn); }
.sync button { border: 0; background: none; color: var(--warn); text-decoration: underline; padding: 0; font-size: 12px; }
.tbr { display: flex; align-items: center; gap: 10px; flex: none; }
@media (max-width: 420px) { .topbar h1 { font-size: 23px; } .sync .st { display: none; } }
.tbr .iconbtn { border: 0; background: none; color: var(--muted); margin-right: -8px; }
.tbr .iconbtn svg { width: 22px; height: 22px; }

main.wrap { padding-block: 4px calc(var(--nav-h) + 96px); display: flex; flex-direction: column; gap: 14px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
.card h2 { font-family: var(--f-display); font-stretch: var(--wd); font-weight: 800; font-size: 20px; margin: 0; text-transform: uppercase; letter-spacing: .02em; line-height: 1.1; text-wrap: balance; }
.label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 10px; }

.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 11px; min-height: 44px; padding: 0 16px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.big { min-height: 54px; font-size: 17px; font-weight: 800; width: 100%; font-family: var(--f-display); font-stretch: 104%; text-transform: uppercase; letter-spacing: .03em; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--warn); }
.btn.danger.armed { background: var(--warn); border-color: var(--warn); color: var(--surface); }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 14px; border-radius: 9px; }
.btn:disabled { opacity: .5; }
.linkbtn { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 6px 0; min-height: 36px; }

/* stats */
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 520px) { .stats { grid-template-columns: repeat(4, 1fr); } }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.stat b { display: block; font-family: var(--f-display); font-stretch: var(--wd); font-weight: 800; font-size: 30px; line-height: 1; margin-top: 6px; font-variant-numeric: tabular-nums; }
.stat span.sub { font-size: 13px; color: var(--muted); }

/* train: week strip, next up */
.strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 12px 6px; }
.strip > * { display: flex; flex-direction: column; gap: 4px; padding: 0 10px; min-width: 0; border: 0; border-left: 1px solid var(--line); background: none; text-align: left; }
.strip > :first-child { border-left: 0; }
.strip b { font-family: var(--f-display); font-stretch: var(--wd); font-weight: 800; font-size: 24px; line-height: 1; font-variant-numeric: tabular-nums; }
.strip b .muted { font-size: 16px; }
.strip .meter { height: 6px; margin-top: 2px; }
.next h2 { font-size: 26px; }
.exlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.exlist li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); }
.exlist li:first-child { border-top: 0; }
.exlist .tgt { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.daypick { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; min-height: 40px; padding: 0 14px; font-weight: 600; }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip.off { color: var(--muted); border-style: dashed; }
.chip small { display: block; font-size: 11px; font-weight: 500; color: var(--muted); margin-top: -2px; }
.chip.off { min-height: 44px; line-height: 1.15; padding-block: 4px; text-align: left; }
.swaps { background: var(--surface-2); border-radius: 11px; padding: 12px; margin-top: 8px; }

/* workout editor */
.sesshead { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.sesshead h2 { font-size: 24px; }
.clock { font-family: var(--f-display); font-stretch: var(--wd); font-weight: 600; font-size: 22px; font-variant-numeric: tabular-nums; color: var(--muted); }
.ex { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 14px 8px; }
.ex.complete { border-color: var(--volt-edge); }
.exhead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.exhead h3 { margin: 0; font-size: 19px; font-weight: 600; line-height: 1.2; min-width: 0; overflow-wrap: anywhere; }
.exhead .tgt { color: var(--muted); font-size: 14px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.last { font-size: 13px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
.sets { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.setrow { display: grid; grid-template-columns: 26px minmax(0, 1fr) minmax(0, 1fr) 48px; gap: 8px; align-items: center; }
.setrow .n { font-family: var(--f-display); font-stretch: var(--wd); font-weight: 700; font-size: 18px; color: var(--muted); text-align: center; }
.field { position: relative; }
.field input { width: 100%; height: 48px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); padding: 0 40px 0 12px; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.field input::placeholder { color: var(--muted); opacity: .55; font-weight: 500; }
.field input:focus { border-color: var(--accent); outline: none; background: var(--surface); }
.field span { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 12px; color: var(--muted); pointer-events: none; text-transform: uppercase; letter-spacing: .05em; }
.done { width: 48px; height: 48px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); display: grid; place-items: center; color: var(--muted); }
.done svg { width: 22px; height: 22px; }
.done.on { background: var(--volt); border-color: var(--volt-edge); color: var(--volt-ink); }
.setrow.isdone .field input { background: var(--volt-soft); border-color: transparent; }
.colhead { display: grid; grid-template-columns: 26px minmax(0, 1fr) minmax(0, 1fr) 48px; gap: 8px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
.colhead span:first-child { text-align: center; }
.exfoot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
.exfoot .grp { display: flex; gap: 4px; }
.pr { display: inline-block; background: var(--accent-soft); color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: .06em; padding: 2px 7px; border-radius: 6px; margin-left: 6px; vertical-align: 2px; }
.addex { display: flex; gap: 8px; }
.addex input, .textin { flex: 1; min-width: 0; height: 46px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); padding: 0 12px; font-size: 16px; }
.stack > .textin, .dayed > .textin { flex: none; }

/* rest bar */
.restbar { position: fixed; left: 0; right: 0; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px)); z-index: 25; pointer-events: none; }
.restbar .wrap { display: flex; justify-content: center; padding-block: 0 10px; }
.restbar .pill { pointer-events: auto; background: var(--ink); color: var(--bg); border-radius: 999px; padding: 8px 8px 8px 18px; display: flex; align-items: center; gap: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
.restbar b { font-family: var(--f-display); font-stretch: var(--wd); font-size: 24px; font-variant-numeric: tabular-nums; min-width: 3.2em; }
.restbar button { border: 0; background: color-mix(in srgb, var(--bg) 18%, transparent); color: var(--bg); border-radius: 999px; min-height: 36px; padding: 0 14px; font-weight: 600; }

/* nav */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 26; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
nav.tabs .wrap { display: grid; grid-template-columns: repeat(4, 1fr); height: var(--nav-h); }
nav.tabs button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .03em; }
nav.tabs button svg { width: 24px; height: 24px; box-sizing: content-box; padding: 3px 18px; border-radius: 999px; }
nav.tabs button.on { color: var(--ink); }
nav.tabs button.on svg { background: var(--volt); color: var(--volt-ink); }

/* charts */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { fill: var(--muted); font-size: 11px; font-family: var(--f-body); }
.chart .lineP { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .areaP { fill: var(--volt); opacity: .28; }
.chart .dot { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
.chart .dot.end { fill: var(--volt); stroke: var(--accent); }
.chart .bar { fill: var(--accent); }
.chart .bar.zero { fill: var(--line); }
.chart .bar.now { fill: var(--volt); stroke: var(--volt-edge); }
.chart .val { fill: var(--ink); font-size: 12px; font-weight: 600; font-family: var(--f-body); }

/* calendar */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.cal .dow { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; padding-bottom: 4px; }
.cal button { aspect-ratio: 1; max-width: 100%; border: 0; border-radius: 9px; background: var(--surface-2); font-variant-numeric: tabular-nums; font-weight: 500; font-size: 15px; position: relative; }
.cal button.out { visibility: hidden; }
.cal button.trained { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.cal button.today { box-shadow: inset 0 0 0 2px var(--ink); }
.cal button.sel { outline: 2px solid var(--accent); outline-offset: 2px; }
.calnav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.calnav b { font-family: var(--f-display); font-stretch: var(--wd); font-size: 20px; text-transform: uppercase; letter-spacing: .03em; }
.iconbtn { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); display: grid; place-items: center; }
.iconbtn svg { width: 18px; height: 18px; }

/* session list */
.slist { display: flex; flex-direction: column; }
.sitem { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; width: 100%; }
.sitem:first-child { border-top: 0; }
.sitem .d { font-family: var(--f-display); font-stretch: var(--wd); font-weight: 700; text-align: center; line-height: 1; }
.sitem .d b { display: block; font-size: 26px; }
.sitem .d small { font-size: 12px; text-transform: uppercase; color: var(--muted); letter-spacing: .05em; }
.sitem .t { min-width: 0; }
.sitem .t strong { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sitem .t span { font-size: 13px; color: var(--muted); }
.sitem .v { font-size: 13px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }

/* progress */
select.sel { width: 100%; height: 48px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); padding: 0 12px; font-size: 17px; font-weight: 600; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border: 1px solid var(--line); border-radius: 11px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: none; border-radius: 8px; min-height: 38px; font-weight: 600; font-size: 14px; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.seg.four button { font-size: 13px; padding: 0 2px; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kpis div { min-width: 0; }
.kpis b { display: block; font-family: var(--f-display); font-stretch: var(--wd); font-size: 26px; font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; }
.kpis small { font-size: 12px; color: var(--muted); }
.up { color: var(--good); } .down { color: var(--warn); }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.tbl th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; padding: 6px 4px; border-bottom: 1px solid var(--line); }
.tbl td { padding: 9px 4px; border-bottom: 1px solid var(--line); }
.tbl td:last-child, .tbl th:last-child { text-align: right; }
.scrollx { overflow-x: auto; }

/* plan editor */
.dayed { display: flex; flex-direction: column; gap: 10px; }
.dayed .dayname { font-family: var(--f-display); font-stretch: var(--wd); font-weight: 700; font-size: 22px; text-transform: uppercase; letter-spacing: .02em; }
.pex { display: grid; grid-template-columns: minmax(0, 1fr) 56px 76px auto; gap: 6px; align-items: center; }
.pex input { height: 42px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface-2); padding: 0 10px; font-size: 16px; min-width: 0; width: 100%; }
.pex input.c { text-align: center; padding: 0 4px; }
.pex .ord { display: flex; gap: 2px; }
.pex .ord button { width: 30px; height: 42px; border: 0; background: none; color: var(--muted); display: grid; place-items: center; padding: 0; }
.pex .ord button svg { width: 16px; height: 16px; }
.pexhead { display: grid; grid-template-columns: minmax(0, 1fr) 56px 76px 92px; gap: 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.pexhead span:nth-child(2), .pexhead span:nth-child(3) { text-align: center; }
/* phones: the exercise name gets its own line, sets, reps and the buttons go below it */
@media (max-width: 560px) {
  .pex { grid-template-columns: 56px 76px minmax(0, 1fr); }
  .pex > input:first-child { grid-column: 1 / -1; }
  .pex .ord { justify-content: flex-end; }
  .pexhead { display: none; }
}

/* sheet */
.sheet { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet .topbar { top: 0; }
.sheet main.wrap { padding-bottom: 40px; }
.datein { height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); padding: 0 10px; font-size: 16px; }

.empty { text-align: center; padding: 28px 16px; }
.empty h2 { margin-bottom: 6px; }
.banner { background: var(--warn-soft); color: var(--ink); border-radius: 12px; padding: 10px 14px; font-size: 14px; }
.okcard { border-color: var(--good); }

/* plan extras: blocks, notes, rest, metcons, info items, tests */
.blockh { display: flex; align-items: baseline; gap: 10px; font-family: var(--f-display); font-stretch: var(--wd); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: 14px; color: var(--muted); margin-top: 6px; }
.blockh::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
.exnote { font-size: 14px; color: var(--muted); margin: 6px 0 0; }
.ex.info { padding-bottom: 14px; background: var(--surface-2); }
.ex.metcon { border: 1.5px solid var(--accent); padding-bottom: 14px; }
.wod { font-size: 15px; white-space: pre-line; margin: 8px 0 0; background: var(--accent-soft); padding: 10px 12px; border-radius: 10px; font-weight: 500; }
.restbtn { border: 1px solid var(--line); background: var(--surface-2); color: var(--accent); border-radius: 8px; min-height: 32px; padding: 0 10px; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 8px; }
.restbar .pill.end { background: var(--accent); color: var(--accent-ink); }
.restbar .pill.end button { color: var(--accent-ink); }
.pex2 { display: grid; grid-template-columns: minmax(0, 1fr) 76px; gap: 6px; margin-top: -4px; }
.pex2 input { height: 38px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface-2); padding: 0 10px; font-size: 14px; min-width: 0; width: 100%; }
.pex2 input.c { text-align: center; padding: 0 4px; }
.pex2.u { grid-template-columns: minmax(0, 1fr) 70px 76px; }

/* ---------- starting test: the first workout finds the weights you start with ---------- */
const TEST_PT = ["squat", "hpush", "hinge", "vpush", "hpull"];
const TEST_LIM = { squat: ["knees", "back"], hinge: ["back"], hpull: ["back"], hpush: ["shoulders"], vpush: ["shoulders"] };
const loaded = name => { const m = moveBy(name); return !!m && /barbell|dumbbells|kettlebells|cables|machines/.test(m.need || ""); };
// one loaded lift per movement from the plan, then bodyweight maxes and the benchmarks, so the test is also the first benchmark result
function startTest(plan, p) {
  const L = new Set(p.limits), easy = p.experience === "new", all = plan.days.flatMap(d => d.exercises), ex = [];
  const add = e => { if (!ex.some(x => same(x.name, e.name))) ex.push({ id: uid(), ...e }); };
  add({ kind: "info", name: "Easy cardio + mobility", reps: "10 min", note: "Row, bike or jog easy, then leg swings, arm circles and a few bodyweight squats.", block: "Warm-up" });
  for (const pt of TEST_PT) {
    const e = all.find(x => !x.kind && !x.slot && moveOf(x.name) === pt && loaded(x.name)); if (!e) continue;
    const lim = (TEST_LIM[pt] || []).filter(k => L.has(k));
    add(lim.length ? { name: e.name, sets: 3, reps: "8 easy", rest: 90, probe: "easy", block: "Lifts", note: `Light sets only, because of your ${andJoin(lowList(LIMITS, lim))}. Stop at a weight that still feels easy.` }
      : easy ? { name: e.name, sets: 5, reps: "8-10", rest: 120, probe: "8", block: "Lifts", note: "Start light. Add a little weight each set while 8–10 reps stay clean. Stop before it gets hard." }
      : { name: e.name, sets: 5, reps: "5", rest: 180, probe: "5", block: "Lifts", note: "Start light and add weight each set while 5 reps stay clean. Your heaviest clean 5 is the result." });
  }
  if (!plan.gear || plan.gear.includes("bar")) add({ name: "Strict pull-ups", sets: 1, reps: "max", rest: 180, block: "Bodyweight", note: "Full hang to chin over the bar, no swing. Can't do one yet? Leave it empty." });
  add({ name: "Push-ups", sets: 1, reps: "max", rest: 120, block: "Bodyweight", note: "Chest to the floor, body in one line. Stop when your form breaks." + (L.has("wrists") ? " Fists or handles if your wrists complain." : "") });
  if ((p.goals.includes("handstand") || p.goals.includes("hspu")) && !L.has("wrists") && !L.has("shoulders")) {
    add({ name: "Wall handstand hold", sets: 1, reps: "max", unit: "s", rest: 120, block: "Bodyweight", note: "Chest to the wall. Leave it empty if you can't get up yet." });
    add({ name: "Freestanding handstand hold", sets: 1, reps: "max", unit: "s", rest: 120, block: "Bodyweight", note: "Only if you can kick up and balance. Otherwise leave it empty." });
  }
  for (const b of buildBench(p)) if (b.unit) add({ name: b.name, sets: 1, reps: "max", ...(b.unit === "reps" ? {} : { unit: b.unit }), rest: 120, block: "Bodyweight" });
  return { id: uid(), name: "Starting test", note: "Finds the weights you start with. Rest fully between sets: this takes 60–90 minutes.", start: true, exercises: ex };
}
const startDay = () => S.plan && S.plan.start || null;
// working weight: what you could lift for the bottom of the rep range with 2 reps left, from the tested max
function setLoads(plan, p) {
  const out = [], key = (o, n) => Object.keys(o || {}).find(k => same(k, n));
  for (const d of plan.days) for (const e of d.exercises) {
    if (e.kind || e.slot || e.unit === "s" || e.unit === "m") continue;
    const k = key(p.e1rm, e.name), lo = parseInt(e.reps, 10), k2 = key(p.easyW, e.name);
    // a lift tested light (because of a limit) keeps the weight you used, not rounded up
    const w = k && lo > 0 ? roundW(p.e1rm[k] / (1 + (lo + 2) / 30)) : k2 ? p.easyW[k2] : 0;
    if (w > 0) { e.load = w; if (!out.some(x => x.name === e.name)) out.push({ name: e.name, w, reps: e.reps }); } else delete e.load;
  }
  return out;
}
// after the starting test: levels, working weights, milestones and benchmarks from the results
function calibrate(s) {
  const j = S.journey, p = j.profile; if (!p) return;
  const found = n => s.exercises.find(e => same(e.name, n));
  const best = n => { const ex = found(n); if (!ex) return undefined; const ds = doneSets(ex); return ds.length ? Math.max(...ds.map(st => st.r)) : 0; };
  const e1 = {}, easy = {};
  for (const ex of s.exercises) {
    const ds = doneSets(ex).filter(st => st.w > 0); if (!ex.probe || !ds.length) continue;
    if (ex.probe === "easy") easy[ex.name] = Math.max(...ds.map(st => st.w));
    else e1[ex.name] = Math.max(...ds.map(st => e1rm(st.w, Math.min(st.r, 12))));
  }
  const before = [p.pull, p.push, p.hs].join(), pu = best("Strict pull-ups"), pm = best("Push-ups"), wall = best("Wall handstand hold"), free = best("Freestanding handstand hold");
  if (pu !== undefined) { p.pullMax = pu; p.pull = lvOf(pu, PULL_CUT); }
  if (pm !== undefined) { p.pushMax = pm; p.push = lvOf(pm, PUSH_CUT); }
  if (wall !== undefined || free !== undefined) p.hs = (free || 0) >= 3 ? 2 : (wall || 0) >= 20 ? 1 : 0;
  p.e1rm = e1; p.easyW = easy; p.tested = s.date;
  delete S.plan.start;
  // other levels mean other exercises: rebuild, with the changes Claude made at setup
  if ([p.pull, p.push, p.hs].join() !== before) {
    const np = buildPlan(p);
    if (j.tailor) { applyTailor(np, j.tailor); if (j.tailor.summary) np.why = [j.tailor.summary, ...(np.why || [])]; }
    if (S.plan.weeklyTarget) np.weeklyTarget = S.plan.weeklyTarget;
    setPlan(np);
  }
  s.calib = setLoads(S.plan, p);
  savePlan(0);
  syncGoals(p);
  j.benchmarks = buildBench(p).map(b => j.benchmarks.find(x => same(x.name, b.name)) || b);
  saveSession(s, 0); saveJourney(0);
}

  const cm = S.calMonth || (now.getFullYear() + "-" + pad(now.getMonth() + 1));
  const [cy, cmo] = cm.split("-").map(Number);
  const byDay = new Map(); for (const s of fin) { if (!byDay.has(s.date)) byDay.set(s.date, []); byDay.get(s.date).push(s); }
  let h = `<div class="stats">
    <div class="stat"><span class="label">This week</span><b>${ws.thisWeek}</b><span class="sub">workouts</span></div>
    <div class="stat"><span class="label">This month</span><b>${ws.thisMonth}</b><span class="sub">workouts</span></div>
    <div class="stat"><span class="label">Week streak</span><b>${ws.cur}</b><span class="sub">best ${ws.best} weeks</span></div>
    <div class="stat"><span class="label">All time</span><b>${ws.total}</b><span class="sub">workouts</span></div></div>`;
  h += `<section class="card stack"><div class="row between"><h2>Workouts per week</h2><span class="muted small">last 12 weeks</span></div>${weekBars(ws.weeks)}
    <p class="muted small" style="margin:0">Average ${fmt([...Array(12)].reduce((a, _, i) => { const d = monday(new Date()); d.setDate(d.getDate() - 7 * i); return a + (ws.weeks.get(ymd(d)) || 0); }, 0) / 12)} per week. A week counts toward the streak when you trained at least once.</p></section>`;
  const first = new Date(cy, cmo - 1, 1), lead = (first.getDay() + 6) % 7, days = new Date(cy, cmo, 0).getDate();
  const monthName = first.toLocaleDateString(undefined, { month: "long", year: "numeric" });
  const inMonth = fin.filter(s => s.date.startsWith(cm));
  let cal = ["Mo", "Tu", "We", "Th", "Fr", "Sa", "Su"].map(d => `<span class="dow">${d}</span>`).join("");
  for (let i = 0; i < lead; i++) cal += `<button class="out" tabindex="-1" aria-hidden="true"></button>`;
  for (let d = 1; d <= days; d++) {
    const k = cm + "-" + pad(d), n = byDay.get(k);
    cal += `<button class="${n ? "trained" : ""}${k === todayStr() ? " today" : ""}${k === S.calDay ? " sel" : ""}" data-a="calday" data-d="${k}" aria-label="${k}${n ? ", trained" : ""}">${d}</button>`;
  }
  h += `<section class="card"><div class="calnav"><button class="iconbtn" data-a="calprev" aria-label="Previous month">${ICON.left}</button><b>${esc(monthName)}</b><button class="iconbtn" data-a="calnext" aria-label="Next month">${ICON.right}</button></div><div class="cal">${cal}</div>
    <p class="muted small" style="margin:10px 0 0">${inMonth.length} ${inMonth.length === 1 ? "workout" : "workouts"} in ${esc(first.toLocaleDateString(undefined, { month: "long" }))}.</p></section>`;
  const list = S.calDay ? (byDay.get(S.calDay) || []) : inMonth;
  h += `<section class="card"><div class="row between"><h2>${S.calDay ? esc(longDate(S.calDay)) : "Workouts"}</h2>${S.calDay ? `<button class="linkbtn" data-a="calclear">Show month</button>` : ""}</div>`;
  if (!list.length) h += `<p class="muted">${S.calDay ? "No workout logged on this day." : fin.length ? "No workouts in this month." : "Finished workouts show up here. Start one from Train."}</p>`;
  else h += `<div class="slist">${list.map(s => { const st = sessionStats(s), d = parseDay(s.date); return `<button class="sitem" data-a="opensess" data-id="${s.id}"><span class="d"><b>${d.getDate()}</b><small>${d.toLocaleDateString(undefined, { weekday: "short" })}</small></span><span class="t"><strong>${esc(s.dayName || "Workout")}</strong><span>${(s.exercises || []).filter(e => doneSets(e).length).map(e => esc(e.name)).join(", ") || "No sets logged"}</span></span><span class="v">${st.sets} sets<br>${fmtInt(st.vol)} ${units()}</span></button>`; }).join("")}</div>`;
  h += `</section>`;
  return h;
}

// Test day results: weight tests show the heaviest set, rep and time tests the best set
function testsHTML() {
  const td = testDay(); if (!td) return "";
  const items = td.exercises.map(resolveEx).filter(e => e.test && e.name.trim());
  if (!items.length) return "";
  const last = finished().find(isTestSession);
  const due = !last ? "Baseline due" : testDue() ? "Test due now" : "Next: " + shortDate(ymd(new Date(parseDay(last.date).getTime() + 42 * 864e5)));
  const cards = items.map(e => {
    const byWeight = !e.unit, hist = exerciseHistory(e.name), u = byWeight ? units() : e.unit;
    const val = p => byWeight ? p.top : p.maxR;
    if (!hist.length) return `<div class="tcard"><span class="label">${esc(e.name)}</span><span class="muted small">No result yet. Log it on ${esc(td.name || "the test day")} and your progress line starts here.</span></div>`;
    const lp = hist[hist.length - 1], d = hist.length > 1 ? val(lp) - val(hist[0]) : null;
    return `<div class="tcard"><span class="label">${esc(e.name)}</span><b>${fmt(val(lp))} <span class="muted" style="font-size:16px">${esc(u)}</span></b>
      <span class="muted small num">${hist.length} test${hist.length > 1 ? "s" : ""} · last ${shortDate(lp.date)}${d != null ? ` · <span class="${d > 0 ? "up" : d < 0 ? "down" : ""}">${d >= 0 ? "+" : ""}${fmt(d)}</span> since first` : ""}</span>
      ${hist.length > 1 ? lineChart(hist.map(p => ({ x: parseDay(p.date).getTime(), y: val(p) })), u, phaseBands()) : ""}</div>`;
  }).join("");
  return `<section class="card stack"><div class="row between"><h2>Benchmarks</h2><span class="muted small">${due}</span></div>
    <p class="muted small" style="margin:0">Set from your goals. You repeat the same tests on ${esc(td.name || "the test day")} every 6 weeks, so phases stay comparable.</p><div class="tests">${cards}</div>
    <button class="btn" style="align-self:flex-start" data-a="pickday" data-id="${td.id}" data-go="train">Show ${esc(td.name || "test day")}</button></section>`;
}

const segHTML = (a, cur, opts) => `<div class="seg" role="tablist">${opts.map(([k, l]) => `<button role="tab" aria-selected="${cur === k}" class="${cur === k ? "on" : ""}" data-a="${a}" data-v="${k}">${l}</button>`).join("")}</div>`;
function viewProgress() {
  if (!S.sessionsLoaded) return `<div class="card empty"><h2>Loading</h2></div>`;
  const tab = S.progTab;
  return `<div class="seg four" role="tablist">${[["lifts", "Lifts"], ["bench", "Benchmarks"], ["goals", "Goals"], ["trophies", "Trophies"]].map(([k, l]) => `<button role="tab" aria-selected="${tab === k}" class="${tab === k ? "on" : ""}" data-a="progtab" data-v="${k}">${l}</button>`).join("")}</div>`
    + ({ bench: progBench, goals: progGoals, trophies: progTrophies }[tab] || progLifts)();
}

function progBench() {
  return testsHTML() || `<div class="card empty stack"><h2>No benchmarks yet</h2><p class="muted">Benchmarks are a few tests you repeat every 6 weeks, always the same, so you can see your progress. They're set from your goals.</p><button class="btn primary" data-a="progtab" data-v="goals">Pick goals</button></div>`;
}

// goals: milestones first, then the picker; milestones come from the profile
function progGoals() {
  const p = J().profile, all = J().goals || [];
  const rank = x => x.g.status === "parked" ? 2 : x.st.done ? 1 : 0;
  const gs = all.map(g => ({ g, st: goalState(g) })).sort((a, b) => rank(a) - rank(b));
  let h = gs.length ? "" : `<div class="card empty stack"><h2>No goals yet</h2><p class="muted">Pick a goal, like a handstand walk or a muscle-up. Lift Log sets its milestones from your profile, and each one you reach shows up here with its date.</p></div>`;
  for (const { g, st } of gs) {
    const tag = st.done ? `<span class="tag good">Reached ${shortDate(st.date)}</span>` : g.status === "parked" ? `<span class="tag">Parked</span>` : `<span class="tag acc">${st.n} / ${st.total}</span>`;
    // goals picked in the questionnaire follow the picker; others (from Claude or older versions) are parked or removed here
    const own = g.key ? "" : `<div class="row" style="gap:6px">${st.done ? "" : `<button class="btn sm" data-a="gpark" data-g="${all.indexOf(g)}">${g.status === "parked" ? "Resume" : "Park"}</button>`}${armBtn("rmgoal:" + g.id, "Remove", "Tap to remove")}</div>`;
    h += `<section class="card stack"><div class="row between" style="flex-wrap:nowrap;align-items:flex-start"><h2>${esc(g.name || "Untitled goal")}</h2>${tag}</div>
      ${st.total ? `<div class="meter${st.done ? " good" : ""}"><i style="width:${Math.round(st.n / st.total * 100)}%"></i></div>` : ""}
      <ul class="mslist">${st.ms.map(x => msItem(g, x, st)).join("") || '<li class="muted small">No milestones yet.</li>'}</ul>${own}</section>`;
  }
  if (!p) return h + `<section class="card stack"><p class="muted small" style="margin:0">To pick goals, answer a few questions about you first. Lift Log sets their milestones and benchmarks from your answers.</p><button class="btn primary" data-a="obstart">Answer a few questions</button></section>`;
  const act = p.goals, built = S.plan && S.plan.goalKeys, stale = built && built.join() !== act.join();
  return h + `<section class="card stack"><details class="more"${gs.length && !S.goalsOpen ? "" : " open"}><summary>Change goals</summary><div class="stack"><p class="muted small" style="margin:0">Pick up to three. Their milestones are set from your profile and tick themselves when you log them.</p>
    <div class="opts">${GOALS.filter(([k]) => k !== "pullup" || p.pull < 2 || act.includes(k)).map(([k, n, d]) => { const on = act.includes(k), g = all.find(x => x.key === k); return `<button class="opt${on ? " on" : ""}" data-a="goaltog" data-k="${k}" aria-pressed="${on}"><b>${esc(n)}${g && goalState(g).done ? " · reached" : ""}</b><span>${esc(d)}</span></button>`; }).join("")}</div></div></details>
    ${stale ? `<div class="banner">Your plan was built for ${esc(built.map(goalName).join(", "))}. <button class="linkbtn" style="min-height:0;padding:0" data-a="rebuild">Rebuild it for these goals</button></div>` : !built ? `<button class="btn" data-a="rebuild">Build my plan from these goals</button>` : ""}</section>`;
}
function msItem(g, x, st) {
  const m = x.m, gi = J().goals.indexOf(g), mi = g.milestones.indexOf(m), ph = x.done && phases().length > 1 ? evPhase(x.date, x.sid) : null;
  let sub;
  if (x.done) sub = `Reached ${shortDate(x.date)}${ph ? " · " + esc(ph.name) : ""}${x.auto ? "" : " · ticked by you"}`;
  else if (m.ex && m.target > 0) { const b = bestOf(m.ex, m.metric); sub = `${esc(canon(m.ex))}: ${b == null ? "not logged yet" : "best " + fmt(b)} / ${fmt(m.target)} ${esc(metU(m.metric))}`; }
  else sub = "Tap the circle when you get it";
  const dot = x.auto ? `<span class="msdot" title="Reached in a logged workout">${ICON.check}</span>`
    : `<button class="msdot" data-a="mstick" data-g="${gi}" data-m="${mi}" aria-pressed="${x.done}" aria-label="${x.done ? "Untick" : "Tick"} ${esc(m.name)}">${x.done ? ICON.check : ""}</button>`;
  return `<li class="${x.done ? "got" : x === st.next ? "next" : ""}">${dot}<span>${esc(m.name)}<br><span class="muted small num">${sub}</span></span></li>`;
}
// phases side by side: training done and the best benchmark result in each
function phasesTable() {
  const ps = phases(); if (!ps.length) return "";
  const js = journeyStats(), td = testDay();
  const items = td ? td.exercises.map(resolveEx).filter(e => e.test && e.name.trim()) : [];
  const cols = ps.map(p => {
    const ss = phaseSessions(p), nx = phaseNext(p), days = (parseDay(nx ? nx.start : todayStr()) - parseDay(p.start)) / 864e5 + (nx ? 0 : 1);
    return { p, ss, n: ss.length, wk: ss.length / Math.max(1, days / 7), prs: ss.reduce((a, s) => a + (js.prsBy.get(s.id) || 0), 0), ms: js.msEv.filter(e => { const q = evPhase(e.date, e.sid); return q && q.id === p.id; }).length };
  });
  const bval = (c, e) => { let v = null; for (const s of c.ss) for (const x of s.exercises || []) if (same(x.name, e.name)) for (const st of doneSets(x)) { const y = e.unit ? st.r : st.w || 0; if (v == null || y > v) v = y; } return v; };
  const row = (label, vals, dp = 0, delta) => `<tr><td>${esc(label)}</td>${vals.map((v, i) => { const pv = i ? vals[i - 1] : null, d = delta && v != null && pv != null ? v - pv : 0; return `<td>${v == null ? "–" : fmt(v, dp)}${d ? ` <span class="small ${d > 0 ? "up" : "down"}">${d > 0 ? "+" : ""}${fmt(d, dp)}</span>` : ""}</td>`; }).join("")}</tr>`;
  let body = row("Workouts", cols.map(c => c.n)) + row("Per week", cols.map(c => c.wk), 1) + row("PRs", cols.map(c => c.prs)) + row("Milestones", cols.map(c => c.ms));
  if (items.length) body += `<tr class="grp"><td colspan="${cols.length + 1}">Best benchmark result</td></tr>` + items.map(e => row(e.name + " (" + (e.unit || units()) + ")", cols.map(c => bval(c, e)), 1, true)).join("");
  return `<section class="card stack"><div class="row between"><h2>Phases side by side</h2><span class="muted small">${ps.length} ${ps.length === 1 ? "phase" : "phases"}</span></div>
    <div class="scrollx"><table class="tbl cmp"><thead><tr><th></th>${cols.map(c => `<th>${esc(c.p.name || "Phase")}<br><span style="text-transform:none;letter-spacing:0;font-weight:500">${shortDate(c.p.start)} – ${c.p.end ? shortDate(c.p.end) : "now"}</span></th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div>
    <p class="muted small" style="margin:0">${ps.length === 1 ? "Start a new phase and it gets its own column here, measured on the same benchmarks." : "Change is against the phase before."}${items.length ? "" : " Pick goals under Progress → Goals and their benchmarks compare phases on the same tests."}</p></section>`;
}

function progTrophies() {
  const js = journeyStats(), recent = js.ev.slice(-12).reverse();
  let h = `<section class="card stack"><div class="lvl"><div><span class="label">Level</span><b>${js.level}</b></div><span class="muted small num" style="text-align:right">${fmtInt(js.xp)} XP<br>${fmtInt(js.toNext)} to level ${js.level + 1}</span></div><div class="meter"><i style="width:${js.pct}%"></i></div>
    <ul class="rules"><li>Workout +${XP.workout}, benchmark test +${XP.test}, each PR +${XP.pr}</li><li>Milestone +${XP.milestone}, goal reached +${XP.goal}, phase finished +${XP.phase}</li></ul></section>`;
  h += `<section class="card stack"><div class="row between"><h2>Trophies</h2><span class="muted small">${js.earned} of ${js.total}</span></div><div class="badges">${js.trophies.map(t => badgeHTML(t)).join("")}</div>
    <p class="muted small" style="margin:0">Each row shows the trophies you have and the next one to unlock.</p></section>`;
  if (recent.length) h += `<section class="card"><h2 style="margin-bottom:8px">Recent XP</h2><div class="scrollx"><table class="tbl"><tbody>${recent.map(e => `<tr><td style="white-space:nowrap">${shortDate(e.date)}</td><td>${esc(e.what)}</td><td>+${e.xp}</td></tr>`).join("")}</tbody></table></div></section>`;
  return h;
}

function progLifts() {
  const counts = new Map();
  for (const s of finished()) for (const ex of s.exercises || []) if (doneSets(ex).length) { const nm = canon(ex.name), k = norm(nm); const c = counts.get(k) || { name: nm, n: 0 }; c.n++; counts.set(k, c); }
  const exs = [...counts.values()].sort((a, b) => b.n - a.n || a.name.localeCompare(b.name));
  if (!exs.length) return `<div class="card empty stack"><h2>No progress yet</h2><p class="muted">After your first finished workout you'll see each exercise's estimated one-rep max, heaviest set and volume over time here.</p></div>`;
  let cur = exs.find(e => norm(e.name) === norm(canon(S.progEx))) || exs[0];
  const hist = exerciseHistory(cur.name);
  const bw = hist.every(p => !p.top);
  const metric = bw ? "reps" : S.progMetric;
  const u = units();
  const val = p => metric === "e1rm" ? p.e1rm : metric === "top" ? p.top : metric === "vol" ? p.vol : p.maxR;
  const unitL = metric === "vol" ? u + " × reps" : metric === "reps" ? "reps" : u;
  const pts = hist.map(p => ({ x: parseDay(p.date).getTime(), y: val(p) }));
  let h = `<section class="card stack"><label class="label" for="progex">Exercise</label><select class="sel" id="progex" data-a="progex">${exs.map(e => `<option value="${esc(e.name)}"${e === cur ? " selected" : ""}>${esc(e.name)} (${e.n})</option>`).join("")}</select>
    ${bw ? `<p class="muted small" style="margin:0">Logged without weight, so this shows your most reps in a set.</p>` : `<div class="seg" role="tablist">${[["e1rm", "Est. 1RM"], ["top", "Heaviest"], ["vol", "Volume"]].map(([k, l]) => `<button role="tab" aria-selected="${metric === k}" class="${metric === k ? "on" : ""}" data-a="metric" data-m="${k}">${l}</button>`).join("")}</div>`}
    ${aliasHTML(cur.name)}</section>`;
  const best = hist.reduce((a, p) => val(p) > val(a) ? p : a, hist[0]);
  const latest = hist[hist.length - 1];
  const ago = days => { const cut = ymd(new Date(Date.now() - days * 864e5)); const older = hist.filter(p => p.date <= cut); return older.length ? older[older.length - 1] : null; };
  const base = ago(28) || hist[0];
  const change = base && val(base) ? (val(latest) - val(base)) / val(base) * 100 : 0;
  const baseLabel = ago(28) ? "vs 4 weeks ago" : "since first log";
  h += `<section class="card stack"><div class="row between"><h2>${esc(cur.name)}</h2><span class="muted small">${metric === "e1rm" ? "estimated 1-rep max" : metric === "top" ? "heaviest set" : metric === "vol" ? "volume per workout" : "most reps"}</span></div>
    <div class="kpis"><div><b>${fmt(val(latest))}</b><small>latest, ${unitL}</small></div><div><b>${fmt(val(best))}</b><small>best, ${shortDate(best.date)}</small></div><div><b class="${change > 0.05 ? "up" : change < -0.05 ? "down" : ""}">${hist.length > 1 ? (change > 0 ? "+" : "") + fmt(change) + "%" : "–"}</b><small>${baseLabel}</small></div></div>
    ${pts.length > 1 ? lineChart(pts, unitL, phaseBands()) : `<p class="muted small">Log this exercise in one more workout to see a trend line.</p>`}
    ${metric === "e1rm" ? `<p class="muted small" style="margin:0">Estimated with the Epley formula from your best set each workout: weight × (1 + reps ÷ 30).</p>` : ""}</section>`;
  h += `<section class="card"><h2 style="margin-bottom:8px">Recent workouts</h2><div class="scrollx"><table class="tbl"><thead><tr><th>Date</th><th>Sets</th><th>Best set</th><th>${bw ? "Reps" : "Est. 1RM"}</th></tr></thead><tbody>
    ${hist.slice(-12).reverse().map(p => `<tr><td>${shortDate(p.date)}</td><td>${p.sets.length}</td><td>${fmt(p.bestSet.w)} × ${p.bestSet.r}</td><td>${bw ? p.maxR : fmt(p.e1rm)}</td></tr>`).join("")}</tbody></table></div></section>`;
  // all-exercise records
  const recs = exs.map(e => { const hh = exerciseHistory(e.name); const b = hh.reduce((a, p) => (p.e1rm || p.maxR) > (a.e1rm || a.maxR) ? p : a, hh[0]); return { name: e.name, b }; });
  h += `<section class="card"><h2 style="margin-bottom:8px">Personal records</h2><div class="scrollx"><table class="tbl"><thead><tr><th>Exercise</th><th>Best set</th><th>Est. 1RM</th></tr></thead><tbody>
    ${recs.map(r => `<tr><td>${esc(r.name)}</td><td>${fmt(r.b.bestSet.w)} × ${r.b.bestSet.r}<br><span class="muted small">${shortDate(r.b.date)}</span></td><td>${r.b.e1rm ? fmt(r.b.e1rm) + " " + u : r.b.maxR + " reps"}</td></tr>`).join("")}</tbody></table></div></section>`;
  return h;
}
// names that count as this exercise, e.g. after a plan renamed it
function aliasHTML(name) {
  const known = knownExercises(), linked = known.filter(n => same(n, name) && norm(n) !== norm(name)), others = known.filter(n => !same(n, name));
  if (!linked.length && !others.length) return "";
  return `<details class="more"${linked.length ? " open" : ""}><summary>Logged it under another name?</summary><div class="stack" style="gap:8px">
    ${linked.length ? `<span class="muted small">Counted as ${esc(name)}. Tap a name to split it off again.</span><div class="daypick">${linked.map(n => `<button class="chip" data-a="unalias" data-n="${esc(n)}" aria-label="Stop counting ${esc(n)} as ${esc(name)}">${esc(n)} ×</button>`).join("")}</div>` : ""}
    ${others.length ? `<select class="sel" data-a="alias" data-to="${esc(name)}" aria-label="Count another exercise name as ${esc(name)}"><option value="">Count another name as this exercise…</option>${others.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join("")}</select>` : ""}</div></details>`;
}

/* ---------- plan: goals, benchmarks, phases ---------- */
function profileCard() {
  const p = J().profile;
  if (!p) return `<section class="card stack"><h2>Your profile</h2><p class="muted small" style="margin:0">Answer a few questions and Lift Log sets your goals, benchmarks and plan from them.</p><button class="btn primary" data-a="obstart">Answer a few questions</button></section>`;
  return `<section class="card stack"><div class="row between"><h2>Your profile</h2><div class="row" style="gap:6px"><button class="btn sm" data-a="obstart">Edit answers</button><button class="btn sm" data-a="obstart" data-fresh="1">Start over</button></div></div><ul class="rules">${profileLines(p).map(l => `<li>${esc(l)}</li>`).join("")}</ul></section>`;
}
function phasesEditor() {
  const p = curPhase(); if (!p) return "";
  const past = phases().filter(q => q.id !== p.id).reverse(), n = phaseSessions(p).length;
  let h = `<section class="card stack"><span class="label">Current phase · since ${shortDate(p.start)} · week ${phaseWeek(p)} · ${n} ${n === 1 ? "workout" : "workouts"}</span>
    <input class="textin dayname" data-a="phname" value="${esc(p.name)}" placeholder="Phase name" aria-label="Phase name">
    <input class="textin" data-a="phfocus" value="${esc(p.focus || "")}" placeholder="Focus, e.g. handstand walk and muscle-up" aria-label="Phase focus">`;
  if (!S.phaseForm) h += `<p class="muted small" style="margin:0">Changing your plan for a new goal? Start a new phase. This plan is kept with this phase, your history stays, and the table below compares the phases side by side. Finishing a phase earns +${XP.phase} XP.</p>
    <div class="row"><button class="btn primary" data-a="phform">Start a new phase</button>${coachOn() && !(S.coach && S.coach.mode === "adjust") ? `<button class="btn" data-a="coachopen">Adjust plan with Claude</button>` : ""}</div>`;
  if (p.prevPlans && p.prevPlans.length && !S.phaseForm) h += `<button class="linkbtn" style="align-self:flex-start" data-a="planrestore">Restore the plan from before the last change</button>`;
  h += `</section>`;

/* rest timer: always counts down. The length comes from the plan's rest time, or from the set itself
   (heavier, lower-rep sets need longer), then adjusts for how hard the set was and what comes next. */
function restBase(ex, st) {
  if (ex.rest > 0) return ex.rest;
  if (ex.unit === "s" || ex.unit === "m") return 90;
  const r = st.r || 0, pf = J().profile, md = pf ? planMode(pf) : "";
  let sec = r <= 5 ? 180 : r <= 8 ? 120 : r <= 12 ? 90 : 60;
  if (md === "strength" && r <= 8) sec += 30;
  if (md === "fitness") sec -= 15;
  if (pf && pf.age >= 50) sec += 30;
  return sec;
}
function restFor(s, i, j) {
  const exs = s.exercises, ex = exs[i], st = ex.sets[j], lifts = exs.filter(e => !e.kind);
  if (lifts.every(e => e.sets.every(x => x.done))) return 0; // workout's done, nothing to rest for
  let sec = restBase(ex, st);
  // missed the bottom of the target rep range: that set was a grind, so rest a bit longer
  const lo = parseInt(String(ex.target || "").split("×").pop(), 10);
  if (ex.unit !== "s" && ex.unit !== "m" && lo > 0 && st.r < lo) sec += 30;
  // last set of this exercise: rest for the next one, plus time to set it up
  if (ex.sets.every(x => x.done)) {
    const nx = exs.slice(i + 1).concat(exs.slice(0, i)).find(e => !e.kind && e.sets.some(x => !x.done));
    if (nx) sec = restBase(nx, nx.sets.find(x => !x.done) || {}) + 30;

}

  S.restAt = Date.now(); S.restLen = Number(sec) || 90; S.restBeeped = false;
}
const restLeft = () => S.restLen * 1000 - (Date.now() - S.restAt);
const restOver = () => restLeft() <= 0;
const restText = () => restOver() ? "0:00" : mmss(restLeft() + 999);
const restLabel = () => restOver() ? "Next set" : "Rest";

  try { if (actx) [0, .25, .5].forEach(o => { const g = actx.createGain(), os = actx.createOscillator(); os.frequency.value = 880; g.gain.value = .15; os.connect(g).connect(actx.destination); os.start(actx.currentTime + o); os.stop(actx.currentTime + o + .15); }); } catch {}

}

        if (st.w == null && b.dataset.phw) st.w = parseNum(b.dataset.phw);
        if (st.r == null && b.dataset.phr) st.r = parseNum(b.dataset.phr);
        if (!(st.r > 0)) { const inp = document.getElementById(`r-${s.id}-${i}-${j}`); if (inp) inp.focus(); toast("Enter the reps first."); return; }
        st.done = true; if (!S.sheetId) { const sec = restFor(s, i, j); if (sec) startRest(sec); else S.restAt = null; }
      } else st.done = false;
      saveSession(s, 300); render(); break;
    }
    case "addset": { const ex = s.exercises[+b.dataset.i]; ex.sets.push({ w: null, r: null, done: false }); saveSession(s); render(); break; }
    case "delset": { const ex = s.exercises[+b.dataset.i]; if (ex.sets.length > 1) ex.sets.pop(); saveSession(s); render(); break; }
    case "exup": { const i = +b.dataset.i; [s.exercises[i - 1], s.exercises[i]] = [s.exercises[i], s.exercises[i - 1]]; saveSession(s); render(); break; }
    case "addex": {
      const inp = b.parentElement.querySelector("input"); const name = inp.value.trim();
      if (!name) { inp.focus(); return; }
      const l = lastFor(name, s);
      s.exercises.push({ name, target: "", sets: Array.from({ length: l ? l.sets.length : 3 }, () => ({ w: null, r: null, done: false })) });
      saveSession(s); render(); break;
    }
    case "finish": finishWorkout(s); break;
    case "restoff": S.restAt = null; render(); break;
    case "rest": startRest(b.dataset.sec); render(); break;
    case "restplus": if (restOver()) { S.restAt = Date.now(); S.restLen = 30; } else S.restLen += 30; S.restBeeped = false; render(); break;
    case "arm": {
      const id = b.dataset.id;
      if (S.armed !== id) { S.armed = id; render(); clearTimeout(window.__armT); window.__armT = setTimeout(() => { if (S.armed === id) { S.armed = null; render(); } }, 4000); return; }
      S.armed = null;
      const [kind, x, y] = id.split(":");
      if (kind === "rmex") { const ss = S.sessions.get(x); ss.exercises.splice(+y, 1); saveSession(ss); }
      else if (kind === "discard") { deleteSession(x); S.restAt = null; toast("Workout discarded."); return; }
      else if (kind === "delsess") { deleteSession(x); S.sheetId = null; toast("Workout deleted."); return; }
      else if (kind === "rmday") { S.plan.days = S.plan.days.filter(d => d.id !== x); savePlan(0); }
      else if (kind === "rmgoal") { jr.goals = jr.goals.filter(g => g.id !== x); saveJourney(0); }
      else if (kind === "skiptest") { delete S.plan.start; S.pickDay = null; savePlan(0); toast("Test skipped. Pick weights that leave 2 reps in reserve."); return; }
      render(); break;
    }
    case "calprev": case "calnext": {
      const now = new Date(); const cm = S.calMonth || (now.getFullYear() + "-" + pad(now.getMonth() + 1));
      const [y, m] = cm.split("-").map(Number); const d = new Date(y, m - 1 + (a === "calnext" ? 1 : -1), 1);
      S.calMonth = d.getFullYear() + "-" + pad(d.getMonth() + 1); S.calDay = null; render(); break;
    }
    case "calday": S.calDay = S.calDay === b.dataset.d ? null : b.dataset.d; render(); break;
    case "calclear": S.calDay = null; render(); break;
    case "opensess": S.sheetId = b.dataset.id; render(); break;
    case "closesheet": S.sheetId = null; render(); break;
    case "metric": S.progMetric = b.dataset.m; ls.set("liftlog.progMetric", S.progMetric); render(); break;
    case "units": jr.settings = { ...jr.settings, units: b.dataset.u }; S.advOpen = true; saveJourney(0); render(); break;
    case "dayup": { const d = +b.dataset.d; [S.plan.days[d - 1], S.plan.days[d]] = [S.plan.days[d], S.plan.days[d - 1]]; savePlan(); render(); break; }
    case "dayadd": S.plan.days.push({ id: uid(), name: "", exercises: [{ id: uid(), name: "", sets: 3, reps: "8-10" }] }); savePlan(); render(); { const last = S.plan.days[S.plan.days.length - 1]; const el = document.getElementById("dn-" + last.id); if (el) { el.scrollIntoView({ block: "center" }); el.focus(); } } break;
    case "exadd": { const d = S.plan.days[+b.dataset.d]; const lastEx = d.exercises[d.exercises.length - 1]; const e2 = { id: uid(), name: "", sets: 3, reps: "8-10" }; if (lastEx && lastEx.block) e2.block = lastEx.block; d.exercises.push(e2); savePlan(); render(); const el = document.getElementById("en-" + e2.id); if (el) el.focus(); break; }
    case "exrm": { const d = S.plan.days[+b.dataset.d]; d.exercises.splice(+b.dataset.e, 1); savePlan(); render(); break; }
    case "exmv": { const d = S.plan.days[+b.dataset.d], i = +b.dataset.e, j = i + +b.dataset.dir; if (j < 0 || j >= d.exercises.length) return; [d.exercises[i], d.exercises[j]] = [d.exercises[j], d.exercises[i]]; savePlan(); render(); break; }
  }
});

app.addEventListener("input", e => {
  const t = e.target, a = t.dataset.a; if (!a) return;
  memo.clear();
  // a changed answer is read again on Next; the chips stay until then
  if (a === "obtext") { const o = S.onb, id = obQs(o.p)[o.step].id; o.text[id] = t.value; o.stale[id] = o.dirty[id] = true; }
  else if (a === "obnum") S.onb.num[t.dataset.k] = t.value;
  else if (a === "phname") { curPhase().name = t.value; saveJourney(); }
  else if (a === "phfocus") { curPhase().focus = t.value; saveJourney(); }
  else if (a === "coachgoal") S.coach.goal = t.value;
  else if (a === "coachnotes") S.coach.notes = t.value;
  else if (a === "coachdays") { const n = parseInt(t.value, 10); if (n >= 1 && n <= 7) S.coach.days = n; }
  else if (a === "coachmin") { const n = parseInt(t.value, 10); if (n >= 15 && n <= 240) S.coach.minutes = n; }
  else if (a === "npname") S.phaseForm.name = t.value;
  else if (a === "npfocus") S.phaseForm.focus = t.value;
  else if (a === "score") {
    const s = editingSession(); if (!s) return;
    s.exercises[+t.dataset.i].score = t.value; saveSession(s, 900);
  } else if (a === "wtarget") { const n = parseInt(t.value, 10); S.plan.weeklyTarget = n > 0 && n <= 14 ? n : 0; savePlan(); }
  else if (a === "exnote") { S.plan.days[+t.dataset.d].exercises[+t.dataset.e].note = t.value; savePlan(); }
  else if (a === "exrest") { const n = parseInt(t.value, 10); S.plan.days[+t.dataset.d].exercises[+t.dataset.e].rest = n > 0 ? n : 0; savePlan(); }
  else if (a === "w" || a === "r") {
    const s = editingSession(); if (!s) return;
    const st = s.exercises[+t.dataset.i].sets[+t.dataset.j];
    st[a] = a === "r" ? (parseNum(t.value) == null ? null : Math.round(parseNum(t.value))) : parseNum(t.value);
    saveSession(s, 900);
  } else if (a === "dayname") { S.plan.days[+t.dataset.d].name = t.value; savePlan(); }
  else if (a === "exname") { S.plan.days[+t.dataset.d].exercises[+t.dataset.e].name = t.value; savePlan(); }
  else if (a === "exsets") { const n = parseInt(t.value, 10); if (n > 0 && n <= 20) { S.plan.days[+t.dataset.d].exercises[+t.dataset.e].sets = n; savePlan(); } }
  else if (a === "exreps") { S.plan.days[+t.dataset.d].exercises[+t.dataset.e].reps = t.value.trim(); savePlan(); }
});
app.addEventListener("change", e => {
  const t = e.target, a = t.dataset.a;
  memo.clear();
  if (a === "progex") { S.progEx = t.value; ls.set("liftlog.progEx", S.progEx); render(); }
  else if (a === "obuseplan") S.onb.usePlan = t.checked;
  else if (a === "exunit") { const x = S.plan.days[+t.dataset.d].exercises[+t.dataset.e]; if (t.value) x.unit = t.value; else delete x.unit; savePlan(0); }
  else if (a === "npplan") {
    S.phaseForm.plan = t.value;
    if (t.value === "ai" && !(S.coach && S.coach.mode === "new")) openCoach("new");
    render();
  }
  else if (a === "npgoal") { const k = S.phaseForm.keep; if (t.checked) { if (!k.includes(t.value)) k.push(t.value); } else S.phaseForm.keep = k.filter(id => id !== t.value); }
  else if (a === "alias" && t.value) {
    // point the picked name, and anything already counted as it, at this exercise
    const to = canon(t.dataset.to), from = norm(t.value), al = S.journey.aliases;
    if (from !== norm(to)) { for (const k of Object.keys(al)) if (norm(al[k]) === from) al[k] = to; al[from] = to; delete al[norm(to)]; saveJourney(0); toast(`${t.value} now counts as ${to}.`); }
  }
  else if (a === "level") { S.plan.level = t.value; savePlan(0); render(); }
  else if (a === "swapkeep") S.swapKeep = t.checked;
  else if (a === "sdate") { const s = editingSession(); if (s && /^\d{4}-\d{2}-\d{2}$/.test(t.value)) { s.date = t.value; saveSession(s, 0); render(); } }
});
app.addEventListener("keydown", e => {
  const t = e.target;
  if (e.key === "Enter" && t.dataset.a === "obnum") { e.preventDefault(); const ins = [...app.querySelectorAll('[data-a="obnum"]')], nx = ins[ins.indexOf(t) + 1]; if (nx) nx.focus(); else obNext(); return; }
  if (e.key === "Enter" && t.id === "swapin") { e.preventDefault(); doSwap(t.value.trim()); return; }
  if (e.key === "Enter" && t.tagName === "INPUT") {
    if (t.id && t.id.startsWith("addex-")) { e.preventDefault(); t.parentElement.querySelector("button").click(); return; }
    if (t.dataset.a === "w") { e.preventDefault(); const r = document.getElementById(t.id.replace(/^w-/, "r-")); if (r) r.focus(); return; }
    if (t.dataset.a === "r") { e.preventDefault(); t.blur(); }
  }
});
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (["train", "history", "progress", "plan"].includes(h)) { S.view = h; render(); } });

render();
initStore();
// self-hosted copy: cache the app so it opens offline (claude.ai serves its own way)
if (!window.claude && "serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
