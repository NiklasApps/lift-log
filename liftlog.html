<!doctype html>
<meta charset="utf-8">
<title>Lift Log</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lift Log">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eceff4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1218" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="liftlog-icon-180.png">
<link rel="apple-touch-icon" href="liftlog-icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one-column phone app; sticky view header, scrolling cards, fixed bottom tab bar. Plate-blue accent on chalk/graphite neutrals. */
:root {
  --bg: #eceff4;
  --surface: #ffffff;
  --surface-2: #f5f7fa;
  --ink: #141a24;
  --muted: #5b6575;
  --line: #d5dae3;
  --accent: #1f56c8;
  --accent-ink: #ffffff;
  --accent-soft: #dde6f8;
  --good: #1d8148;
  --good-soft: #dcf1e4;
  --warn: #b9441a;
  --warn-soft: #f8e3da;
  --f-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --f-body: "Barlow", -apple-system, "Segoe UI", Roboto, sans-serif;
  --nav-h: 62px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1218; --surface: #171c25; --surface-2: #1d2330; --ink: #e8ecf2; --muted: #8f99a9;
    --line: #2a3140; --accent: #5d8ef2; --accent-ink: #0a1022; --accent-soft: #1b2944;
    --good: #4cc27f; --good-soft: #15301f; --warn: #f0804f; --warn-soft: #3a2017;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1218; --surface: #171c25; --surface-2: #1d2330; --ink: #e8ecf2; --muted: #8f99a9;
  --line: #2a3140; --accent: #5d8ef2; --accent-ink: #0a1022; --accent-soft: #1b2944;
  --good: #4cc27f; --good-soft: #15301f; --warn: #f0804f; --warn-soft: #3a2017;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); }
.topbar .wrap { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-block: 14px 10px; }
.topbar h1 { font-family: var(--f-display); font-weight: 700; font-size: 30px; letter-spacing: .01em; margin: 0; text-transform: uppercase; line-height: 1; }
.sync { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.sync.ok i { background: var(--good); }
.sync.busy i { background: var(--accent); }
.sync.err { color: var(--warn); } .sync.err i { background: var(--warn); }
.sync button { border: 0; background: none; color: var(--warn); text-decoration: underline; padding: 0; font-size: 12px; }

main.wrap { padding-block: 4px calc(var(--nav-h) + 96px); display: flex; flex-direction: column; gap: 14px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.card h2 { font-family: var(--f-display); font-weight: 700; font-size: 22px; margin: 0; text-transform: uppercase; letter-spacing: .02em; line-height: 1.1; text-wrap: balance; }
.label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 10px; }

.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 11px; min-height: 44px; padding: 0 16px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.big { min-height: 54px; font-size: 18px; width: 100%; font-family: var(--f-display); text-transform: uppercase; letter-spacing: .04em; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--warn); }
.btn.danger.armed { background: var(--warn); border-color: var(--warn); color: var(--surface); }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 14px; border-radius: 9px; }
.btn:disabled { opacity: .5; }
.linkbtn { border: 0; background: none; color: var(--accent); font-weight: 600; padding: 6px 0; min-height: 36px; }

/* stats */
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 520px) { .stats { grid-template-columns: repeat(4, 1fr); } }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.stat b { display: block; font-family: var(--f-display); font-weight: 700; font-size: 34px; line-height: 1; margin-top: 6px; font-variant-numeric: tabular-nums; }
.stat span.sub { font-size: 13px; color: var(--muted); }

/* train: next up */
.next h2 { font-size: 30px; }
.exlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.exlist li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); }
.exlist li:first-child { border-top: 0; }
.exlist .tgt { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.daypick { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; min-height: 40px; padding: 0 14px; font-weight: 600; }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* workout editor */
.sesshead { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.sesshead h2 { font-size: 28px; }
.clock { font-family: var(--f-display); font-weight: 600; font-size: 22px; font-variant-numeric: tabular-nums; color: var(--muted); }
.ex { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 14px 8px; }
.ex.complete { border-color: var(--good); }
.exhead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.exhead h3 { margin: 0; font-size: 19px; font-weight: 600; line-height: 1.2; min-width: 0; overflow-wrap: anywhere; }
.exhead .tgt { color: var(--muted); font-size: 14px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.last { font-size: 13px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
.sets { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.setrow { display: grid; grid-template-columns: 26px minmax(0, 1fr) minmax(0, 1fr) 48px; gap: 8px; align-items: center; }
.setrow .n { font-family: var(--f-display); font-weight: 700; font-size: 18px; color: var(--muted); text-align: center; }
.field { position: relative; }
.field input { width: 100%; height: 48px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); padding: 0 40px 0 12px; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.field input::placeholder { color: var(--muted); opacity: .55; font-weight: 500; }
.field input:focus { border-color: var(--accent); outline: none; background: var(--surface); }
.field span { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 12px; color: var(--muted); pointer-events: none; text-transform: uppercase; letter-spacing: .05em; }
.done { width: 48px; height: 48px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); display: grid; place-items: center; color: var(--muted); }
.done svg { width: 22px; height: 22px; }
.done.on { background: var(--good); border-color: var(--good); color: var(--surface); }
.setrow.isdone .field input { background: var(--good-soft); border-color: transparent; }
.colhead { display: grid; grid-template-columns: 26px minmax(0, 1fr) minmax(0, 1fr) 48px; gap: 8px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
.colhead span:first-child { text-align: center; }
.exfoot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
.exfoot .grp { display: flex; gap: 4px; }
.pr { display: inline-block; background: var(--accent-soft); color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: .06em; padding: 2px 7px; border-radius: 6px; margin-left: 6px; vertical-align: 2px; }
.addex { display: flex; gap: 8px; }
.addex input, .textin { flex: 1; min-width: 0; height: 46px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); padding: 0 12px; font-size: 16px; }
.stack > .textin, .dayed > .textin { flex: none; }

/* rest bar */
.restbar { position: fixed; left: 0; right: 0; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px)); z-index: 25; pointer-events: none; }
.restbar .wrap { display: flex; justify-content: center; padding-block: 0 10px; }
.restbar .pill { pointer-events: auto; background: var(--ink); color: var(--bg); border-radius: 999px; padding: 8px 8px 8px 18px; display: flex; align-items: center; gap: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
.restbar b { font-family: var(--f-display); font-size: 24px; font-variant-numeric: tabular-nums; min-width: 3.2em; }
.restbar button { border: 0; background: color-mix(in srgb, var(--bg) 18%, transparent); color: var(--bg); border-radius: 999px; min-height: 36px; padding: 0 14px; font-weight: 600; }

/* nav */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 26; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
nav.tabs .wrap { display: grid; grid-template-columns: repeat(4, 1fr); height: var(--nav-h); }
nav.tabs button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--muted); font-size: 12px; font-weight: 600; letter-spacing: .03em; }
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs button.on { color: var(--accent); }

/* charts */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { fill: var(--muted); font-size: 11px; font-family: var(--f-body); }
.chart .lineP { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .areaP { fill: var(--accent); opacity: .12; }
.chart .dot { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
.chart .dot.end { fill: var(--accent); }
.chart .bar { fill: var(--accent); }
.chart .bar.zero { fill: var(--line); }
.chart .bar.now { fill: var(--accent); opacity: .55; }
.chart .val { fill: var(--ink); font-size: 12px; font-weight: 600; font-family: var(--f-body); }

/* calendar */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.cal .dow { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; padding-bottom: 4px; }
.cal button { aspect-ratio: 1; max-width: 100%; border: 0; border-radius: 9px; background: var(--surface-2); font-variant-numeric: tabular-nums; font-weight: 500; font-size: 15px; position: relative; }
.cal button.out { visibility: hidden; }
.cal button.trained { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.cal button.today { box-shadow: inset 0 0 0 2px var(--ink); }
.cal button.sel { outline: 2px solid var(--accent); outline-offset: 2px; }
.calnav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.calnav b { font-family: var(--f-display); font-size: 20px; text-transform: uppercase; letter-spacing: .03em; }
.iconbtn { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); display: grid; place-items: center; }
.iconbtn svg { width: 18px; height: 18px; }

/* session list */
.slist { display: flex; flex-direction: column; }
.sitem { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; width: 100%; }
.sitem:first-child { border-top: 0; }
.sitem .d { font-family: var(--f-display); font-weight: 700; text-align: center; line-height: 1; }
.sitem .d b { display: block; font-size: 26px; }
.sitem .d small { font-size: 12px; text-transform: uppercase; color: var(--muted); letter-spacing: .05em; }
.sitem .t { min-width: 0; }
.sitem .t strong { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sitem .t span { font-size: 13px; color: var(--muted); }
.sitem .v { font-size: 13px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }

/* progress */
select.sel { width: 100%; height: 48px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); padding: 0 12px; font-size: 17px; font-weight: 600; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border: 1px solid var(--line); border-radius: 11px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: none; border-radius: 8px; min-height: 38px; font-weight: 600; font-size: 14px; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kpis div { min-width: 0; }
.kpis b { display: block; font-family: var(--f-display); font-size: 26px; font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; }
.kpis small { font-size: 12px; color: var(--muted); }
.up { color: var(--good); } .down { color: var(--warn); }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.tbl th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; padding: 6px 4px; border-bottom: 1px solid var(--line); }
.tbl td { padding: 9px 4px; border-bottom: 1px solid var(--line); }
.tbl td:last-child, .tbl th:last-child { text-align: right; }
.scrollx { overflow-x: auto; }

/* plan editor */
.dayed { display: flex; flex-direction: column; gap: 10px; }
.dayed .dayname { font-family: var(--f-display); font-weight: 700; font-size: 22px; text-transform: uppercase; letter-spacing: .02em; }
.pex { display: grid; grid-template-columns: minmax(0, 1fr) 56px 76px auto; gap: 6px; align-items: center; }
.pex input { height: 42px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface-2); padding: 0 10px; font-size: 16px; min-width: 0; width: 100%; }
.pex input.c { text-align: center; padding: 0 4px; }
.pex .ord { display: flex; gap: 2px; }
.pex .ord button { width: 30px; height: 42px; border: 0; background: none; color: var(--muted); display: grid; place-items: center; padding: 0; }
.pex .ord button svg { width: 16px; height: 16px; }
.pexhead { display: grid; grid-template-columns: minmax(0, 1fr) 56px 76px 92px; gap: 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.pexhead span:nth-child(2), .pexhead span:nth-child(3) { text-align: center; }

/* sheet */
.sheet { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet .topbar { top: 0; }
.sheet main.wrap { padding-bottom: 40px; }
.datein { height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); padding: 0 10px; font-size: 16px; }

.empty { text-align: center; padding: 28px 16px; }
.empty h2 { margin-bottom: 6px; }
.banner { background: var(--warn-soft); color: var(--ink); border-radius: 12px; padding: 10px 14px; font-size: 14px; }
.okcard { border-color: var(--good); }

/* plan extras: blocks, notes, rest, metcons, info items, tests */
.blockh { display: flex; align-items: baseline; gap: 10px; font-family: var(--f-display); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: 14px; color: var(--muted); margin-top: 6px; }
.blockh::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
.exnote { font-size: 14px; color: var(--muted); margin: 6px 0 0; }
.ex.info { padding-bottom: 14px; background: var(--surface-2); }
.ex.metcon { border: 1.5px solid var(--accent); padding-bottom: 14px; }
.wod { font-size: 15px; white-space: pre-line; margin: 8px 0 0; background: var(--accent-soft); padding: 10px 12px; border-radius: 10px; font-weight: 500; }
.restbtn { border: 1px solid var(--line); background: var(--surface-2); color: var(--accent); border-radius: 8px; min-height: 32px; padding: 0 10px; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 8px; }
.restbar .pill.end { background: var(--accent); color: var(--accent-ink); }
.restbar .pill.end button { color: var(--accent-ink); }
.pex2 { display: grid; grid-template-columns: minmax(0, 1fr) 76px; gap: 6px; margin-top: -4px; }
.pex2 input { height: 38px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface-2); padding: 0 10px; font-size: 14px; min-width: 0; width: 100%; }
.pex2 input.c { text-align: center; padding: 0 4px; }
.pex2.u { grid-template-columns: minmax(0, 1fr) 70px 76px; }
.pex2 select { height: 38px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface-2); padding: 0 6px; font-size: 14px; min-width: 0; width: 100%; }
.pex input:disabled { opacity: .75; }
.slotnote { font-size: 12px; color: var(--muted); margin-top: -4px; }
.tests { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.tcard { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tcard b { font-family: var(--f-display); font-size: 26px; font-weight: 700; line-height: 1.05; font-variant-numeric: tabular-nums; }
.rules { margin: 0; padding-left: 18px; color: var(--muted); font-size: 14px; display: flex; flex-direction: column; gap: 6px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 70px); z-index: 50; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 500; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: no-preference) { .toast { animation: rise .2s ease-out; } @keyframes rise { from { transform: translate(-50%, 8px); opacity: 0; } } }

/* journey: level, goals, phases, trophies */
:root { --t1: #b8743a; --t2: #8a97a8; --t3: #c99a1c; --medal-ink: #17120a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --t1: #d08a4c; --t2: #a9b4c4; --t3: #e2b437; } }
:root[data-theme="dark"] { --t1: #d08a4c; --t2: #a9b4c4; --t3: #e2b437; }
.meter { height: 8px; border-radius: 999px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; min-width: 4px; background: var(--accent); border-radius: inherit; }
.meter.good i { background: var(--good); }
.lvl { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.lvl b { display: block; font-family: var(--f-display); font-weight: 700; font-size: 34px; line-height: 1; margin-top: 4px; }
.goalmini { display: flex; flex-direction: column; gap: 6px; padding-top: 10px; border-top: 1px solid var(--line); }
.tag { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.tag.acc { background: var(--accent-soft); color: var(--accent); }
.tag.good { background: var(--good-soft); color: var(--good); }
.mslist { list-style: none; margin: 0; padding: 0; }
.mslist li { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 12px; padding: 7px 0; position: relative; }
.mslist li::before { content: ""; position: absolute; left: 11px; top: 31px; bottom: -7px; border-left: 2px solid var(--line); }
.mslist li:last-child::before { display: none; }
.mslist li.got::before { border-color: var(--good); }
.msdot { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; padding: 0; color: var(--surface); position: relative; z-index: 1; flex: none; }
.msdot svg { width: 14px; height: 14px; }
button.msdot::after { content: ""; position: absolute; inset: -10px; }
button.msdot:disabled { opacity: 1; cursor: default; }
.msdot.on, li.got .msdot, .unlock .msdot { background: var(--good); border-color: var(--good); }
li.next .msdot { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.msed { display: grid; grid-template-columns: 32px minmax(0, 1fr) 40px; gap: 6px; align-items: center; }
.msed2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 6px; margin: -2px 0 4px 38px; }
.msed2 > :first-child { grid-column: 1 / -1; }
@media (min-width: 520px) { .msed2 { grid-template-columns: minmax(0, 1fr) 76px 110px; } .msed2 > :first-child { grid-column: auto; } }
.bench { display: grid; grid-template-columns: minmax(0, 1fr) 124px 40px; gap: 6px; align-items: center; }
.fin { height: 40px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface-2); padding: 0 10px; font-size: 16px; min-width: 0; width: 100%; }
.fin.c { text-align: center; padding: 0 4px; }
.check { display: flex; align-items: center; gap: 10px; min-height: 40px; font-weight: 500; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 14px 8px; }
.badge { display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; min-width: 0; }
.badge .medal { width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 24px; color: var(--medal-ink); margin-bottom: 4px; box-shadow: inset 0 0 0 4px rgba(255,255,255,.28), 0 2px 6px rgba(0,0,0,.18); }
.badge .medal small { font-size: 13px; }
.badge.t1 .medal { background: var(--t1); }
.badge.t2 .medal { background: var(--t2); }
.badge.t3 .medal { background: var(--t3); }
.badge.locked .medal { background: var(--surface-2); color: var(--muted); box-shadow: inset 0 0 0 2px var(--line); }
.badge .cap { font-size: 13px; font-weight: 600; line-height: 1.2; }
.badge.locked .cap { color: var(--muted); }
.badge .when { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.unlock { display: flex; align-items: center; gap: 10px; background: var(--good-soft); border-radius: 10px; padding: 9px 12px; font-size: 14px; }
.unlock.lvlup { background: var(--accent-soft); }
.xp { font-family: var(--f-display); font-weight: 700; font-size: 28px; color: var(--accent); line-height: 1; white-space: nowrap; }
.tbl.cmp td:not(:first-child), .tbl.cmp th:not(:first-child) { text-align: right; }
.tbl.cmp th { vertical-align: bottom; }
.tbl.cmp tr.grp td { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; padding-top: 14px; text-align: left; }
.chart .band { fill: var(--accent); opacity: .07; }
.chart .bandline { stroke: var(--muted); stroke-dasharray: 3 3; opacity: .6; }
.chart .bandl { fill: var(--muted); font-size: 10px; font-weight: 600; font-family: var(--f-body); letter-spacing: .04em; }
.textarea { width: 100%; min-height: 64px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); padding: 10px 12px; font: inherit; font-size: 16px; color: inherit; resize: vertical; }
.draft { border: 1.5px solid var(--accent); border-radius: 12px; padding: 12px; }
.draft h3 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 22px; text-transform: uppercase; letter-spacing: .02em; line-height: 1.1; }
.dday { display: flex; flex-direction: column; gap: 4px; border-top: 1px solid var(--line); padding-top: 8px; }
.dday .exlist li { padding: 6px 0; }
details.more summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: 14px; min-height: 32px; display: flex; align-items: center; }
details.more[open] summary { margin-bottom: 8px; }
@media (prefers-reduced-motion: no-preference) { .pop { animation: pop .55s cubic-bezier(.2, 1.5, .4, 1) both; } @keyframes pop { from { transform: scale(.6); opacity: 0; } } }

/* ---------- storage: claude.ai db, local fallback, outbox for unsent writes ---------- */
let db = null, downloads = null;
const dirty = new Map(), timers = new Map(), queues = new Map(), deleted = new Set();
let ver = 0;
const outbox = () => ls.get("liftlog.outbox") || {};
const setOutbox = o => ls.set("liftlog.outbox", o);
function enqueue(key, fn) { const p = (queues.get(key) || Promise.resolve()).then(fn, fn); queues.set(key, p); return p; }

function setSync(s) {
  if (S.sync === s) return; S.sync = s;
  const el = app.querySelector(".topbar .sync"); if (el) el.outerHTML = syncHTML();
}
function syncHTML() {
  if (S.mode === "local") return '<span class="sync"><i></i>On this device</span>';
  if (S.sync === "error") return '<span class="sync err"><i></i>Not saved <button data-a="retry">Retry</button></span>';
  if (S.sync === "saving" || dirty.size) return '<span class="sync busy"><i></i>Saving…</span>';
  if (S.mode === "cloud") return '<span class="sync ok"><i></i>Saved</span>';
  return '<span class="sync"><i></i>Loading…</span>';
}

function saveLocalAll() { ls.set("liftlog.local", { plan: S.plan, journey: S.journey, sessions: [...S.sessions.values()] }); }

function write(key, path, getBody, delay) {
  if (S.mode === "local") { saveLocalAll(); return; }
  const v = ++ver; dirty.set(key, v);
  const ob = outbox(); ob[key] = getBody(); setOutbox(ob);
  setSync("saving");
  clearTimeout(timers.get(key));
  timers.set(key, setTimeout(() => flush(key, path, getBody, v), delay));
}
function flush(key, path, getBody, v, attempt = 0) {
  return enqueue(key, async () => {
    if (dirty.get(key) !== v) return;
    const body = getBody(); if (!body) { dirty.delete(key); return; }
    try {
      await db.doc(path).set(clone(body));
      if (dirty.get(key) === v) { dirty.delete(key); const ob = outbox(); delete ob[key]; setOutbox(ob); }
      if (!dirty.size) setSync("saved");
    } catch (e) {
      if (attempt < 2 && (!e || e.code === "unavailable" || e.code === "resource_exhausted")) {
        setTimeout(() => flush(key, path, getBody, v, attempt + 1), 1500 + Math.random() * 1500);
      } else { setSync("error"); }
    }
  });
}
function retryAll() {
  setSync("saving");
  const ob = outbox();
  for (const key of Object.keys(ob)) {
    if (key === "plan") { if (S.plan) savePlan(0); }
    else if (key === "journey") { if (S.journey) saveJourney(0); }
    else { const s = S.sessions.get(key.slice(2)); if (s) saveSession(s, 0); }
  }
  if (!Object.keys(ob).length) setSync("saved");
}

function saveSession(s, delay = 600) {
  s.updatedAt = Date.now(); S.sessions.set(s.id, s); deleted.delete(s.id);
  write("s:" + s.id, "sessions/" + s.id, () => S.sessions.get(s.id), delay);
}
function savePlan(delay = 700) {
  S.plan.updatedAt = Date.now();
  write("plan", "config/plan", () => S.plan, delay);
}
function saveJourney(delay = 700) {
  if (!S.journey) return;
  S.journey.updatedAt = Date.now();
  write("journey", "config/journey", () => S.journey, delay);
}
function deleteSession(id) {
  S.sessions.delete(id); deleted.add(id);
  dirty.delete("s:" + id); clearTimeout(timers.get("s:" + id));
  const ob = outbox(); delete ob["s:" + id]; setOutbox(ob);
  if (S.mode === "local") { saveLocalAll(); return; }
  setSync("saving");
  enqueue("s:" + id, async () => { try { await db.doc("sessions/" + id).delete(); if (!dirty.size) setSync("saved"); } catch { setSync("error"); } });
}

let outboxChecked = false;
function replayOutbox() {
  if (outboxChecked || !S.planLoaded || !S.sessionsLoaded || !S.journeyLoaded) return;
  outboxChecked = true;
  const ob = outbox();
  for (const [key, body] of Object.entries(ob)) {
    if (!body) continue;
    if (key === "plan") {
      if (!S.plan || (S.plan.updatedAt || 0) < (body.updatedAt || 0)) { S.plan = body; savePlan(0); }
    } else if (key === "journey") {
      if (!S.journey || (S.journey.updatedAt || 0) < (body.updatedAt || 0)) { S.journey = body; saveJourney(0); }
    } else {
      const remote = S.sessions.get(body.id);
      if (!remote || (remote.updatedAt || 0) < (body.updatedAt || 0)) { S.sessions.set(body.id, body); saveSession(body, 0); }
    }
  }
  fixJourney();
  if (!dirty.size) setSync("saved");
}

async function initStore() {
  if (window.claude && window.claude.use) window.claude.use("sample").then(f => { sampleFn = f || null; if (f) scheduleRender(); }, () => {});
  let ns = null;
  try { ns = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch { ns = null; }
  if (!ns) {
    S.mode = "local";
    const saved = ls.get("liftlog.local") || {};
    S.plan = saved.plan || null; S.planLoaded = true;
    (saved.sessions || []).forEach(s => S.sessions.set(s.id, s)); S.sessionsLoaded = true;
    S.journey = saved.journey || null; S.journeyLoaded = true; fixJourney();
    render(); return;
  }
  db = ns; S.mode = "cloud";

function niceTicks(lo, hi, n = 4) {

    if (b.x0 > x0) g += `<line class="bandline" x1="${xa.toFixed(1)}" x2="${xa.toFixed(1)}" y1="${T}" y2="${H - B}"/>`;
    const fit = Math.floor((w - 8) / 6.2), lb = b.label.toUpperCase();

  const dots = pts.length <= 40 ? pts.map((p, i) => `<circle class="dot${i === pts.length - 1 ? " end" : ""}" cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="${i === pts.length - 1 ? 4.5 : 3}"/>`).join("") : `<circle class="dot end" cx="${X(pts[pts.length - 1].x)}" cy="${Y(pts[pts.length - 1].y)}" r="4.5"/>`;

  return `<nav class="tabs"><div class="wrap">${t.map(([k, l, i]) => `<button data-a="view" data-v="${k}" class="${S.view === k ? "on" : ""}" aria-current="${S.view === k ? "page" : "false"}">${i}${l}</button>`).join("")}</div></nav>`;
}
function armBtn(id, label, armedLabel, cls = "btn sm danger") {
  const on = S.armed === id;
  return `<button class="${cls}${on ? " armed" : ""}" data-a="arm" data-id="${esc(id)}">${on ? armedLabel : label}</button>`;
}

function viewTrain() {
  if (!S.planLoaded || !S.sessionsLoaded) return `<div class="card empty"><h2>Loading</h2><p class="muted">Fetching your plan and workouts.</p></div>`;
  const act = activeSession();
  if (act) return editorHTML(act, true);
  let h = "";
  if (S.justFinished && S.sessions.get(S.justFinished)) h += finishedCard(S.sessions.get(S.justFinished));
  if (!S.plan || !S.plan.days.length) {
    return h + `<div class="card empty stack"><h2>Set up your plan</h2><p class="muted">Your plan is the list of workout days and the exercises in each. Start from a push / pull / legs template and change it to match what you do, or build it from scratch.</p>
      <button class="btn primary big" data-a="starter">Use the starter plan</button><button class="btn" data-a="blankplan">Build my own</button></div>`;
  }
  const ws = weekStats(), nd = nextDay(), last = finished()[0], wt = Number(S.plan.weeklyTarget) || 0;
  h += `<div class="stats">
    <div class="stat"><span class="label">This week</span><b>${ws.thisWeek}${wt ? `<span class="muted" style="font-size:22px"> / ${wt}</span>` : ""}</b><span class="sub">${wt ? (ws.thisWeek >= wt ? "target reached" : "workouts") : ws.thisWeek === 1 ? "workout" : "workouts"}</span></div>
    <div class="stat"><span class="label">Week streak</span><b>${ws.cur}</b><span class="sub">best ${ws.best}</span></div>
    <div class="stat"><span class="label">This month</span><b>${ws.thisMonth}</b><span class="sub">workouts</span></div>
    <div class="stat"><span class="label">Last workout</span><b style="font-size:24px;margin-top:10px">${last ? shortDate(last.date) : "–"}</b><span class="sub">${last ? esc(last.dayName || "Workout") : "none yet"}</span></div>
  </div>`;
  h += journeyCard();
  const td = testDay();
  if (td && testDue() && S.pickDay !== td.id) h += `<section class="card stack" style="border-color:var(--accent)"><h2>Test due</h2><p class="muted small" style="margin:0">${finished().some(isTestSession) ? "It's been 6 weeks since your last test." : "Set your baseline."} Do ${esc(td.name || "the test day")} in place of one regular workout this week. +${XP.test} XP.</p><button class="btn" data-a="pickday" data-id="${td.id}">Show ${esc(td.name || "test day")}</button></section>`;
  const pick = S.pickDay && findDay(S.pickDay) || nd;
  h += `<section class="card next stack"><span class="label">${pick === nd ? "Next up" : "Selected"}</span><h2>${esc(pick.name || "Untitled day")}</h2>${pick.note ? `<p class="muted small" style="margin:-4px 0 0">${esc(pick.note)}</p>` : ""}
    <ul class="exlist">${pick.exercises.map(resolveEx).filter(e => e.name.trim()).map(e => { const l = e.kind ? null : lastFor(e.name); return `<li><span${e.kind === "info" ? ' class="muted"' : ""}>${esc(e.name)}${l ? `<br><span class="muted small num">Last: ${l.bestSet.w ? fmt(l.bestSet.w) + " × " : ""}${l.bestSet.r}</span>` : ""}</span><span class="tgt">${esc(exTarget(e))}</span></li>`; }).join("") || '<li class="muted">No exercises yet. Add them in Plan.</li>'}</ul>
    <button class="btn primary big" data-a="start" data-id="${pick.id}">Start ${esc(pick.name || "workout")}</button></section>`;
  const days = S.plan.days.map(d => d.test ? td || d : d);
  if (td && !planTestDay()) days.push(td);
  if (days.length > 1) h += `<div class="stack"><span class="label">Or pick another day</span><div class="daypick">${days.map(d => `<button class="chip${d.id === pick.id ? " on" : ""}" data-a="pickday" data-id="${d.id}">${esc(d.name || "Untitled")}</button>`).join("")}<button class="chip" data-a="start" data-id="">Empty workout</button></div></div>`;
  return h;
}
function finishedCard(s) {
  const st = sessionStats(s), js = journeyStats(), me = js.bySession.get(s.id);
  const prs = (s.exercises || []).filter(ex => isPR(ex.name, s, ex)).map(ex => ex.name);
  const ms = js.msEv.filter(e => e.sid === s.id), gl = js.goalEv.filter(e => e.sid === s.id), tro = js.trophies.filter(t => t.date && t.sid === s.id);
  const up = me && levelOf(me.after) > levelOf(me.before);
  return `<section class="card okcard stack"><div class="row between"><h2>Workout saved</h2><button class="iconbtn" data-a="dismissdone" aria-label="Dismiss">${ICON.x}</button></div>
    <div class="kpis"><div><b>${st.sets}</b><small>sets</small></div><div><b>${fmtInt(st.vol)}</b><small>${units()} volume</small></div><div><b>${st.dur ? mmss(st.dur) : "–"}</b><small>duration</small></div></div>
    ${prs.length ? `<p class="small" style="margin:0"><span class="pr">PR</span> New best estimated 1RM: ${prs.map(esc).join(", ")}</p>` : ""}
    ${me ? `<div class="row between" style="flex-wrap:nowrap"><span class="xp pop">+${me.xp} XP</span><span class="muted small" style="text-align:right">${me.items.map(e => esc(e.what.split(":")[0]) + " +" + e.xp).join(" · ")}</span></div>
      <div class="meter"><i style="width:${js.pct}%"></i></div><span class="muted small">Level ${js.level} · ${fmtInt(js.toNext)} XP to level ${js.level + 1}</span>` : ""}
    ${up ? `<div class="unlock lvlup pop"><span><b>Level up!</b> You're now level ${levelOf(me.after)}.</span></div>` : ""}
    ${ms.map(e => { const g = goalState(e.g); return `<div class="unlock pop"><span class="msdot">${ICON.check}</span><span><b>Milestone reached:</b> ${esc(e.m.name)}<br><span class="muted small">${esc(e.g.name || "Goal")} · ${g.n} / ${g.total}</span></span></div>`; }).join("")}
    ${gl.map(e => `<div class="unlock pop"><span><b>Goal reached: ${esc(e.g.name || "Untitled goal")}</b><br><span class="muted small">Every milestone done. +${XP.goal} XP</span></span></div>`).join("")}
    ${tro.length ? `<span class="label">New trophies</span><div class="badges">${tro.map(t => badgeHTML(t, true)).join("")}</div>` : ""}</section>`;
}

// Train: level, current phase and the next milestone of each active goal
function journeyCard() {
  const js = journeyStats(), p = curPhase(), all = J().goals || [];
  const gs = all.filter(g => g.status !== "parked").map(g => ({ g, st: goalState(g) })).filter(x => !x.st.done && x.st.total);
  let h = `<section class="card stack"><div class="lvl"><div><span class="label">Level ${js.level}</span><b class="num">${fmtInt(js.xp)} <span class="muted" style="font-size:18px">XP</span></b></div>
    ${p ? `<button class="linkbtn" data-a="gotophase" style="text-align:right;line-height:1.25">${esc(p.name || "Current phase")}<br><span class="muted small" style="font-weight:500">week ${phaseWeek(p)}</span></button>` : ""}</div>
    <div class="meter"><i style="width:${js.pct}%"></i></div><span class="muted small">${fmtInt(js.toNext)} XP to level ${js.level + 1}</span>`;
  if (gs.length) h += gs.slice(0, 3).map(({ g, st }) => {
    const m = st.next.m, b = m.ex && m.target > 0 ? bestOf(m.ex, m.metric) : null;
    return `<div class="goalmini"><div class="row between" style="flex-wrap:nowrap"><strong>${esc(g.name || "Untitled goal")}</strong><span class="muted small num">${st.n} / ${st.total}</span></div><div class="meter"><i style="width:${Math.round(st.n / st.total * 100)}%"></i></div>
      <span class="muted small">Next: ${esc(m.name)}${b != null ? ` · best ${fmt(b)} / ${fmt(m.target)} ${esc(metU(m.metric))}` : ""}</span></div>`;
  }).join("");
  else if (!all.length) h += `<p class="muted small" style="margin:0">Set a goal, like a handstand walk or a muscle-up. Every milestone you reach earns +${XP.milestone} XP.</p><button class="btn sm" style="align-self:flex-start" data-a="gotogoals">Add a goal</button>`;
  return h + `</section>`;
}

function editorHTML(s, live) {
  const u = units();
  let h = `<div class="sesshead"><div><span class="label">${live ? "In progress" : longDate(s.date)}</span><h2>${esc(s.dayName || "Workout")}</h2></div>${live ? `<span class="clock" data-clock="${s.startedAt}">${mmss(Date.now() - s.startedAt)}</span>` : ""}</div>`;
  if (!live) h += `<div class="row"><label class="label" for="sdate">Date</label><input class="datein" type="date" id="sdate" data-a="sdate" value="${esc(s.date)}" max="${todayStr()}"></div>`;
  let blk = "";
  (s.exercises || []).forEach((ex, i) => {
    if (ex.block && ex.block !== blk) h += `<div class="blockh">${esc(ex.block)}</div>`;
    blk = ex.block || blk;
    const note = ex.note ? `<p class="exnote">${esc(ex.note)}</p>` : "";
    const rmBtn = armBtn("rmex:" + s.id + ":" + i, "Remove", "Tap to remove", "btn sm ghost danger");
    if (ex.kind === "info") {
      h += `<section class="ex info" data-ex="${i}"><div class="exhead"><h3>${esc(ex.name)}</h3>${ex.target ? `<span class="tgt">${esc(ex.target)}</span>` : ""}</div>${note}</section>`;
      return;
    }
    if (ex.kind === "metcon") {
      h += `<section class="ex metcon" data-ex="${i}"><div class="exhead"><h3>${esc(ex.name)}</h3></div>${ex.wod ? `<p class="wod">${esc(ex.wod)}</p>` : ""}${note}
        <div class="row" style="margin-top:10px;flex-wrap:nowrap"><label class="label" for="sc-${s.id}-${i}">Score</label><input class="textin" id="sc-${s.id}-${i}" data-a="score" data-i="${i}" value="${esc(ex.score || "")}" placeholder="e.g. 5 rounds + 12" autocomplete="off" enterkeyhint="done"></div>
        <div class="exfoot" style="justify-content:flex-end">${rmBtn}</div></section>`;
      return;
    }
    const ru = ex.unit || "reps";
    const last = lastFor(ex.name, s);
    const ds = doneSets(ex), complete = ex.sets.length && ex.sets.every(st => st.done);
    const pr = ds.length && isPR(ex.name, s, ex);
    h += `<section class="ex${complete ? " complete" : ""}" data-ex="${i}">
      <div class="exhead"><h3>${esc(ex.name)}${pr ? '<span class="pr">PR</span>' : ""}</h3>${ex.target ? `<span class="tgt">${esc(ex.target)}</span>` : ""}</div>
      <div class="last">${last ? `Last time, ${shortDate(last.date)}: ${last.sets.map(st => fmt(st.w) + "×" + st.r).join(", ")}` : "First time logging this"}</div>${note}
      ${ex.rest && live ? `<button class="restbtn" data-a="rest" data-sec="${ex.rest}">Rest ${mmss(ex.rest * 1000)}</button>` : ""}
      <div class="sets"><div class="colhead"><span>Set</span><span>Weight</span><span>${esc(ru)}</span><span></span></div>`;
    ex.sets.forEach((st, j) => {
      const ref = last ? (last.sets[j] || last.sets[last.sets.length - 1]) : null;
      const prevInSess = j > 0 ? ex.sets[j - 1] : null;
      const phW = ref ? fmt(ref.w) : prevInSess && prevInSess.w != null ? fmt(prevInSess.w) : "";
      const phR = ref ? ref.r : prevInSess && prevInSess.r != null ? prevInSess.r : (ex.target ? String(ex.target).split("×").pop().trim().split(/[-–]/)[0].trim() : "");
      h += `<div class="setrow${st.done ? " isdone" : ""}">
        <span class="n">${j + 1}</span>
        <label class="field"><input id="w-${s.id}-${i}-${j}" inputmode="decimal" enterkeyhint="next" autocomplete="off" data-a="w" data-i="${i}" data-j="${j}" value="${st.w ?? ""}" placeholder="${esc(phW)}" aria-label="Set ${j + 1} weight in ${u}"><span>${u}</span></label>
        <label class="field"><input id="r-${s.id}-${i}-${j}" inputmode="numeric" enterkeyhint="done" autocomplete="off" data-a="r" data-i="${i}" data-j="${j}" value="${st.r ?? ""}" placeholder="${esc(phR)}" aria-label="Set ${j + 1} ${esc(ru)}"><span>${esc(ru === "reps" ? "reps" : ru)}</span></label>
        <button class="done${st.done ? " on" : ""}" data-a="done" data-i="${i}" data-j="${j}" data-phw="${esc(phW)}" data-phr="${esc(phR)}" aria-label="${st.done ? "Mark set " + (j + 1) + " not done" : "Mark set " + (j + 1) + " done"}" aria-pressed="${st.done}">${ICON.check}</button>
      </div>`;
    });
    h += `</div><div class="exfoot"><div class="grp"><button class="linkbtn" data-a="addset" data-i="${i}">+ Add set</button>${ex.sets.length > 1 ? `<button class="linkbtn" style="color:var(--muted);margin-left:12px" data-a="delset" data-i="${i}">Remove last set</button>` : ""}</div>
      <div class="grp">${i > 0 ? `<button class="iconbtn" style="border:0;background:none" data-a="exup" data-i="${i}" aria-label="Move up">${ICON.up}</button>` : ""}${rmBtn}</div></div></section>`;
  });
  h += `<section class="card stack"><label class="label" for="addex-${s.id}">Add an exercise</label><div class="addex"><input id="addex-${s.id}" list="exnames" placeholder="e.g. Dips" autocomplete="off" enterkeyhint="done"><button class="btn primary" data-a="addex">Add</button></div>
    <datalist id="exnames">${knownExercises().map(n => `<option value="${esc(n)}"></option>`).join("")}</datalist></section>`;
  if (live) {
    h += `<button class="btn primary big" data-a="finish">Finish workout</button>
      <div class="row" style="justify-content:center">${armBtn("discard:" + s.id, "Discard workout", "Tap again to discard", "btn ghost danger")}</div>`;
  } else {
    h += `<div class="row" style="justify-content:center">${armBtn("delsess:" + s.id, "Delete this workout", "Tap again to delete", "btn ghost danger")}</div>`;
  }
  return h;
}

function viewHistory() {
  if (!S.sessionsLoaded) return `<div class="card empty"><h2>Loading</h2></div>`;
  const ws = weekStats(), fin = finished();
  const now = new Date();
  const cm = S.calMonth || (now.getFullYear() + "-" + pad(now.getMonth() + 1));
  const [cy, cmo] = cm.split("-").map(Number);
  const byDay = new Map(); for (const s of fin) { if (!byDay.has(s.date)) byDay.set(s.date, []); byDay.get(s.date).push(s); }
  let h = `<div class="stats">
    <div class="stat"><span class="label">This week</span><b>${ws.thisWeek}</b><span class="sub">workouts</span></div>
    <div class="stat"><span class="label">This month</span><b>${ws.thisMonth}</b><span class="sub">workouts</span></div>
    <div class="stat"><span class="label">Week streak</span><b>${ws.cur}</b><span class="sub">best ${ws.best} weeks</span></div>
    <div class="stat"><span class="label">All time</span><b>${ws.total}</b><span class="sub">workouts</span></div></div>`;
  h += `<section class="card stack"><div class="row between"><h2>Workouts per week</h2><span class="muted small">last 12 weeks</span></div>${weekBars(ws.weeks)}
    <p class="muted small" style="margin:0">Average ${fmt([...Array(12)].reduce((a, _, i) => { const d = monday(new Date()); d.setDate(d.getDate() - 7 * i); return a + (ws.weeks.get(ymd(d)) || 0); }, 0) / 12)} per week. A week counts toward the streak when you trained at least once.</p></section>`;
  const first = new Date(cy, cmo - 1, 1), lead = (first.getDay() + 6) % 7, days = new Date(cy, cmo, 0).getDate();
  const monthName = first.toLocaleDateString(undefined, { month: "long", year: "numeric" });
  const inMonth = fin.filter(s => s.date.startsWith(cm));
  let cal = ["Mo", "Tu", "We", "Th", "Fr", "Sa", "Su"].map(d => `<span class="dow">${d}</span>`).join("");
  for (let i = 0; i < lead; i++) cal += `<button class="out" tabindex="-1" aria-hidden="true"></button>`;
  for (let d = 1; d <= days; d++) {
    const k = cm + "-" + pad(d), n = byDay.get(k);
    cal += `<button class="${n ? "trained" : ""}${k === todayStr() ? " today" : ""}${k === S.calDay ? " sel" : ""}" data-a="calday" data-d="${k}" aria-label="${k}${n ? ", trained" : ""}">${d}</button>`;
  }
  h += `<section class="card"><div class="calnav"><button class="iconbtn" data-a="calprev" aria-label="Previous month">${ICON.left}</button><b>${esc(monthName)}</b><button class="iconbtn" data-a="calnext" aria-label="Next month">${ICON.right}</button></div><div class="cal">${cal}</div>
    <p class="muted small" style="margin:10px 0 0">${inMonth.length} ${inMonth.length === 1 ? "workout" : "workouts"} in ${esc(first.toLocaleDateString(undefined, { month: "long" }))}.</p></section>`;
  const list = S.calDay ? (byDay.get(S.calDay) || []) : inMonth;
  h += `<section class="card"><div class="row between"><h2>${S.calDay ? esc(longDate(S.calDay)) : "Workouts"}</h2>${S.calDay ? `<button class="linkbtn" data-a="calclear">Show month</button>` : ""}</div>`;
  if (!list.length) h += `<p class="muted">${S.calDay ? "No workout logged on this day." : fin.length ? "No workouts in this month." : "Finished workouts show up here. Start one from Train."}</p>`;
  else h += `<div class="slist">${list.map(s => { const st = sessionStats(s), d = parseDay(s.date); return `<button class="sitem" data-a="opensess" data-id="${s.id}"><span class="d"><b>${d.getDate()}</b><small>${d.toLocaleDateString(undefined, { weekday: "short" })}</small></span><span class="t"><strong>${esc(s.dayName || "Workout")}</strong><span>${(s.exercises || []).filter(e => doneSets(e).length).map(e => esc(e.name)).join(", ") || "No sets logged"}</span></span><span class="v">${st.sets} sets<br>${fmtInt(st.vol)} ${units()}</span></button>`; }).join("")}</div>`;
  h += `</section>`;
  return h;
}

// Test day results: weight tests show the heaviest set, rep and time tests the best set
function testsHTML() {
  const td = testDay(); if (!td) return "";
  const items = td.exercises.map(resolveEx).filter(e => e.test && e.name.trim());
  if (!items.length) return "";
  const last = finished().find(isTestSession);
  const due = !last ? "Baseline due" : testDue() ? "Test due now" : "Next: " + shortDate(ymd(new Date(parseDay(last.date).getTime() + 42 * 864e5)));
  const cards = items.map(e => {
    const byWeight = !e.unit, hist = exerciseHistory(e.name), u = byWeight ? units() : e.unit;
    const val = p => byWeight ? p.top : p.maxR;
    if (!hist.length) return `<div class="tcard"><span class="label">${esc(e.name)}</span><span class="muted small">No result yet. Log it on ${esc(td.name || "the test day")} and your progress line starts here.</span></div>`;
    const lp = hist[hist.length - 1], d = hist.length > 1 ? val(lp) - val(hist[0]) : null;
    return `<div class="tcard"><span class="label">${esc(e.name)}</span><b>${fmt(val(lp))} <span class="muted" style="font-size:16px">${esc(u)}</span></b>
      <span class="muted small num">${hist.length} test${hist.length > 1 ? "s" : ""} · last ${shortDate(lp.date)}${d != null ? ` · <span class="${d > 0 ? "up" : d < 0 ? "down" : ""}">${d >= 0 ? "+" : ""}${fmt(d)}</span> since first` : ""}</span>
      ${hist.length > 1 ? lineChart(hist.map(p => ({ x: parseDay(p.date).getTime(), y: val(p) })), u, phaseBands()) : ""}</div>`;
  }).join("");
  return `<section class="card stack"><div class="row between"><h2>Benchmarks</h2><span class="muted small">${due}</span></div><div class="tests">${cards}</div></section>`;
}

const segHTML = (a, cur, opts) => `<div class="seg" role="tablist">${opts.map(([k, l]) => `<button role="tab" aria-selected="${cur === k}" class="${cur === k ? "on" : ""}" data-a="${a}" data-v="${k}">${l}</button>`).join("")}</div>`;
function viewProgress() {
  if (!S.sessionsLoaded) return `<div class="card empty"><h2>Loading</h2></div>`;
  const tab = S.progTab;
  return segHTML("progtab", tab, [["lifts", "Lifts"], ["goals", "Goals"], ["trophies", "Trophies"]]) + (tab === "goals" ? progGoals() : tab === "trophies" ? progTrophies() : progLifts());
}

function progGoals() {
  const rank = x => x.g.status === "parked" ? 2 : x.st.done ? 1 : 0;
  const gs = (J().goals || []).map(g => ({ g, st: goalState(g) })).sort((a, b) => rank(a) - rank(b));
  let h = gs.length ? "" : `<div class="card empty stack"><h2>No goals yet</h2><p class="muted">Pick a skill, like a handstand walk or a muscle-up, and split it into milestones. Each one you reach shows up here with its date.</p><button class="btn primary" data-a="gotogoals">Add a goal</button></div>`;
  for (const { g, st } of gs) {
    const tag = st.done ? `<span class="tag good">Reached ${shortDate(st.date)}</span>` : g.status === "parked" ? `<span class="tag">Parked</span>` : `<span class="tag acc">${st.n} / ${st.total}</span>`;
    h += `<section class="card stack"><div class="row between" style="flex-wrap:nowrap;align-items:flex-start"><h2>${esc(g.name || "Untitled goal")}</h2>${tag}</div>
      ${st.total ? `<div class="meter${st.done ? " good" : ""}"><i style="width:${Math.round(st.n / st.total * 100)}%"></i></div>` : ""}
      <ul class="mslist">${st.ms.map(x => msItem(g, x, st)).join("") || '<li class="muted small">No milestones yet. Add them under Plan → Goals.</li>'}</ul></section>`;
  }
  return h + phasesTable();
}
function msItem(g, x, st) {
  const m = x.m, gi = J().goals.indexOf(g), mi = g.milestones.indexOf(m), ph = x.done && phases().length > 1 ? evPhase(x.date, x.sid) : null;
  let sub;
  if (x.done) sub = `Reached ${shortDate(x.date)}${ph ? " · " + esc(ph.name) : ""}${x.auto ? "" : " · ticked by you"}`;
  else if (m.ex && m.target > 0) { const b = bestOf(m.ex, m.metric); sub = `${esc(canon(m.ex))}: ${b == null ? "not logged yet" : "best " + fmt(b)} / ${fmt(m.target)} ${esc(metU(m.metric))}`; }
  else sub = "Tap the circle when you get it";
  const dot = x.auto ? `<span class="msdot" title="Reached in a logged workout">${ICON.check}</span>`
    : `<button class="msdot" data-a="mstick" data-g="${gi}" data-m="${mi}" aria-pressed="${x.done}" aria-label="${x.done ? "Untick" : "Tick"} ${esc(m.name)}">${x.done ? ICON.check : ""}</button>`;
  return `<li class="${x.done ? "got" : x === st.next ? "next" : ""}">${dot}<span>${esc(m.name)}<br><span class="muted small num">${sub}</span></span></li>`;
}

  const L = [`Today: ${todayStr()}. Weight unit: ${u}.`, `Workouts logged: ${fin.length} in total, ${recent.length} in the last 8 weeks (${fmt(recent.length / 8)} per week)${S.plan && S.plan.weeklyTarget ? `; their target is ${S.plan.weeklyTarget} per week` : ""}.`];

  if (S.plan && S.plan.days.length) {

    if (S.plan.rules && S.plan.rules.length) L.push("Progression rules: " + S.plan.rules.join(" "));

const restLeft = () => S.restLen * 1000 - (Date.now() - S.restAt);
const restOver = () => !!S.restLen && restLeft() <= 0;
const restText = () => S.restLen ? (restOver() ? "0:00" : mmss(restLeft() + 999)) : mmss(Date.now() - S.restAt);
const restLabel = () => S.restLen ? (restOver() ? "Next set" : "Rest") : "Rest";
function beep() {
  try { if (actx) [0, .25, .5].forEach(o => { const g = actx.createGain(), os = actx.createOscillator(); os.frequency.value = 880; g.gain.value = .15; os.connect(g).connect(actx.destination); os.start(actx.currentTime + o); os.stop(actx.currentTime + o + .15); }); } catch {}
  try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch {}
}

let wakeLock = null;
async function updateWakeLock() {
  const want = !!activeSession() && document.visibilityState === "visible";
  try {
    if (want && !wakeLock && navigator.wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); }
    else if (!want && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch { wakeLock = null; }
}
document.addEventListener("visibilitychange", updateWakeLock);

/* ---------- actions ---------- */
function editingSession() { return S.sheetId ? S.sessions.get(S.sheetId) : activeSession(); }
function startWorkout(dayId) {
  const day = dayId ? findDay(dayId) : null, ph = curPhase();
  const s = {
    id: uid(), dayId: day ? day.id : null, dayName: day ? day.name || "Workout" : "Workout", date: todayStr(), phaseId: ph ? ph.id : null,
    startedAt: Date.now(), finishedAt: null, finished: false, test: !!(day && day.test),
    exercises: day ? day.exercises.map(resolveEx).filter(e => e.name.trim()).map(e => {
      const x = { name: e.name.trim(), target: exTarget(e), sets: e.kind ? [] : Array.from({ length: Math.max(1, Number(e.sets) || 1) }, () => ({ w: null, r: null, done: false })) };
      for (const k of ["kind", "block", "note", "rest", "unit", "wod", "test"]) if (e[k]) x[k] = e[k];
      return x;
    }) : []
  };
  S.justFinished = null; S.pickDay = null;
  saveSession(s, 0); window.scrollTo(0, 0); render();
}
function finishWorkout(s) {
  for (const ex of s.exercises) ex.sets = ex.sets.filter(st => st.done || st.w != null || st.r != null);
  // sets with values but not ticked count as done
  for (const ex of s.exercises) for (const st of ex.sets) if (st.r > 0) st.done = true;
  s.exercises = s.exercises.filter(ex => ex.sets.length || (ex.kind === "metcon" && String(ex.score || "").trim()));
  if (!s.exercises.length) { deleteSession(s.id); S.restAt = null; toast("Nothing was logged, so the workout was discarded."); return; }
  s.finished = true; s.finishedAt = Date.now(); s.date = ymd(new Date(s.startedAt));
  saveSession(s, 0); S.justFinished = s.id; S.restAt = null; window.scrollTo(0, 0); render();
}
function makePlan(p) { S.plan = p; savePlan(0); render(); }
// outside claude.ai (self-hosted copy): plain browser download
function saveFile(name, blob) {
  const a = document.createElement("a"), url = URL.createObjectURL(blob);
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function exportData(f) {
  const u = units(); let data, name;
  if (f === "csv") {
    const rows = [["date", "phase", "workout", "exercise", "set", "weight_" + u, "reps", "est_1rm"]];
    for (const s of finished().slice().reverse()) for (const ex of s.exercises) doneSets(ex).forEach((st, k) => rows.push([s.date, (phaseOf(s) || {}).name || "", s.dayName || "", ex.name, k + 1, st.w ?? 0, st.r, fmt(e1rm(st.w || 0, st.r))]));
    data = rows.map(r => r.map(c => /[",\n]/.test(String(c)) ? '"' + String(c).replace(/"/g, '""') + '"' : c).join(",")).join("\n");
    name = "lift-log-sets-" + todayStr() + ".csv";
  } else {
    data = JSON.stringify({ exportedAt: new Date().toISOString(), plan: S.plan, journey: S.journey, sessions: finished() }, null, 2);
    name = "lift-log-backup-" + todayStr() + ".json";
  }
  if (!downloads) { saveFile(name, new Blob([data], { type: f === "csv" ? "text/csv" : "application/json" })); return; }
  downloads.save({ filename: name, data }).catch(e => { if (e && e.code !== "declined") toast("The file couldn't be saved here."); });
}

app.addEventListener("click", e => {
  const b = e.target.closest("[data-a]"); if (!b || b.tagName === "INPUT" || b.tagName === "SELECT" || b.tagName === "TEXTAREA") return;
  const a = b.dataset.a;
  if (a !== "arm" && S.armed) { S.armed = null; }
  memo.clear();
  const s = editingSession(), jr = S.journey;
  const goal = () => jr.goals[+b.dataset.g], ms = () => goal().milestones[+b.dataset.m];
  switch (a) {
    case "view": S.view = b.dataset.v; ls.set("liftlog.view", S.view); window.scrollTo(0, 0); render(); break;
    case "retry": retryAll(); break;
    case "starter": makePlan(STARTER()); toast("Starter plan added. Change it any time under Plan."); break;
    case "blankplan": makePlan(BLANK()); S.view = "plan"; render(); break;
    case "pickday": S.pickDay = b.dataset.id; if (b.dataset.go) { S.view = b.dataset.go; window.scrollTo(0, 0); } render(); break;
    case "progtab": S.progTab = b.dataset.v; ls.set("liftlog.progTab", S.progTab); render(); break;
    case "plantab": S.planTab = b.dataset.v; ls.set("liftlog.planTab", S.planTab); render(); break;
    case "gotogoals": case "gotophase": S.view = "plan"; S.planTab = a === "gotogoals" ? "goals" : "phases"; window.scrollTo(0, 0); render(); break;
    case "goaladd": {
      const p = GOAL_PRESETS[b.dataset.p];
      jr.goals.push({ id: uid(), name: p ? p.name : "", status: "active", createdAt: todayStr(), milestones: p ? p.ms.map(([name, ex, target, metric]) => ({ id: uid(), name, ex, target, metric })) : [{ id: uid(), name: "", metric: "r" }] });
      saveJourney(0); render();
      const els = app.querySelectorAll('[data-a="gname"]'), el = els[els.length - 1];
      if (el) { el.scrollIntoView({ block: "center" }); if (!p) el.focus(); }
      if (p) toast("Goal added. Rename the exercises to match how you log them, or link the names under Progress.");
      break;
    }
    case "gpark": goal().status = goal().status === "parked" ? "active" : "parked"; saveJourney(0); render(); break;
    case "mstick": {
      const m = ms();
      if (m.doneAt) delete m.doneAt; else m.doneAt = todayStr();
      saveJourney(0); memo.clear();
      const st = goalState(goal());
      if (m.doneAt) toast(st.done ? `Goal reached: ${goal().name}! +${XP.milestone + XP.goal} XP` : `Milestone reached! +${XP.milestone} XP`);
      else render();
      break;
    }
    case "msadd": goal().milestones.push({ id: uid(), name: "", metric: "r" }); saveJourney(); render(); break;
    case "msrm": goal().milestones.splice(+b.dataset.m, 1); saveJourney(); render(); break;
    case "badd": jr.benchmarks.push({ id: uid(), name: b.dataset.n, unit: b.dataset.u }); saveJourney(); render(); if (!b.dataset.n) { const els = app.querySelectorAll('[data-a="bname"]'); if (els.length) els[els.length - 1].focus(); } break;
    case "brm": jr.benchmarks.splice(+b.dataset.b, 1); saveJourney(); render(); break;
    case "unalias": delete jr.aliases[norm(b.dataset.n)]; saveJourney(0); render(); break;
    case "phform": {
      if (coachCtl) coachCtl.abort();
      const plan = b.dataset.plan || (coachOn() ? "ai" : "keep");
      S.phaseForm = { name: "", focus: "", plan, keep: jr.goals.filter(g => g.status !== "parked" && !goalState(g).done).map(g => g.id) };
      S.coach = null; if (plan === "ai") openCoach("new");
      render(); const el = document.getElementById("np-name"); if (el) { el.scrollIntoView({ block: "center" }); el.focus(); } break;
    }
    case "phcancel": if (coachCtl) coachCtl.abort(); S.phaseForm = null; S.coach = null; render(); break;
    case "phstart":
      if (S.phaseForm.plan === "ai" && !(S.coach && S.coach.draft)) { toast(S.coach && S.coach.status === "busy" ? "Wait for Claude's draft first." : "Draft the plan with Claude first, or pick another plan."); return; }
      startPhase(); break;
    case "coachopen": openCoach("adjust"); render(); { const el = document.getElementById("cg"); if (el) { el.scrollIntoView({ block: "center" }); el.focus(); } } break;
    case "coachrun": runCoach(); break;
    case "coachstop": if (coachCtl) coachCtl.abort(); break;
    case "coachclose": S.coach = null; render(); break;
    case "coachdiscard": S.coach.draft = null; S.coach.status = "idle"; render(); break;
    case "coachapply": applyCoach(); break;
    case "planrestore": { const p = curPhase(), prev = p.prevPlans.shift(); if (S.plan) p.prevPlans.unshift(clone(S.plan)); S.plan = prev; savePlan(0); saveJourney(0); toast("Previous plan restored. Tap again to switch back."); break; }
    case "start": startWorkout(b.dataset.id); break;
    case "dismissdone": S.justFinished = null; render(); break;
    case "done": {
      const i = +b.dataset.i, j = +b.dataset.j, st = s.exercises[i].sets[j];
      if (!st.done) {
        if (st.w == null && b.dataset.phw) st.w = parseNum(b.dataset.phw);
        if (st.r == null && b.dataset.phr) st.r = parseNum(b.dataset.phr);
        if (!(st.r > 0)) { const inp = document.getElementById(`r-${s.id}-${i}-${j}`); if (inp) inp.focus(); toast("Enter the reps first."); return; }
        st.done = true; if (!S.sheetId) startRest(s.exercises[i].rest);
      } else st.done = false;
      saveSession(s, 300); render(); break;
    }
    case "addset": { const ex = s.exercises[+b.dataset.i]; ex.sets.push({ w: null, r: null, done: false }); saveSession(s); render(); break; }
    case "delset": { const ex = s.exercises[+b.dataset.i]; if (ex.sets.length > 1) ex.sets.pop(); saveSession(s); render(); break; }
    case "exup": { const i = +b.dataset.i; [s.exercises[i - 1], s.exercises[i]] = [s.exercises[i], s.exercises[i - 1]]; saveSession(s); render(); break; }
    case "addex": {
      const inp = b.parentElement.querySelector("input"); const name = inp.value.trim();
      if (!name) { inp.focus(); return; }
      const l = lastFor(name, s);
      s.exercises.push({ name, target: "", sets: Array.from({ length: l ? l.sets.length : 3 }, () => ({ w: null, r: null, done: false })) });
      saveSession(s); render(); break;
    }
    case "finish": finishWorkout(s); break;
    case "restoff": S.restAt = null; render(); break;
    case "rest": startRest(b.dataset.sec); render(); break;
    case "restplus": if (restOver()) { S.restAt = Date.now(); S.restLen = 30; } else S.restLen += 30; S.restBeeped = false; render(); break;
    case "arm": {
      const id = b.dataset.id;
      if (S.armed !== id) { S.armed = id; render(); clearTimeout(window.__armT); window.__armT = setTimeout(() => { if (S.armed === id) { S.armed = null; render(); } }, 4000); return; }
      S.armed = null;
      const [kind, x, y] = id.split(":");
      if (kind === "rmex") { const ss = S.sessions.get(x); ss.exercises.splice(+y, 1); saveSession(ss); }
      else if (kind === "discard") { deleteSession(x); S.restAt = null; toast("Workout discarded."); return; }
      else if (kind === "delsess") { deleteSession(x); S.sheetId = null; toast("Workout deleted."); return; }
      else if (kind === "rmday") { S.plan.days = S.plan.days.filter(d => d.id !== x); savePlan(0); }
      else if (kind === "rmgoal") { jr.goals = jr.goals.filter(g => g.id !== x); saveJourney(0); }
      render(); break;
    }
    case "calprev": case "calnext": {
      const now = new Date(); const cm = S.calMonth || (now.getFullYear() + "-" + pad(now.getMonth() + 1));
      const [y, m] = cm.split("-").map(Number); const d = new Date(y, m - 1 + (a === "calnext" ? 1 : -1), 1);
      S.calMonth = d.getFullYear() + "-" + pad(d.getMonth() + 1); S.calDay = null; render(); break;
    }
    case "calday": S.calDay = S.calDay === b.dataset.d ? null : b.dataset.d; render(); break;
    case "calclear": S.calDay = null; render(); break;
    case "opensess": S.sheetId = b.dataset.id; render(); break;
    case "closesheet": S.sheetId = null; render(); break;
    case "metric": S.progMetric = b.dataset.m; ls.set("liftlog.progMetric", S.progMetric); render(); break;
    case "units": S.plan.units = b.dataset.u; savePlan(0); render(); break;
    case "dayup": { const d = +b.dataset.d; [S.plan.days[d - 1], S.plan.days[d]] = [S.plan.days[d], S.plan.days[d - 1]]; savePlan(); render(); break; }
    case "dayadd": S.plan.days.push({ id: uid(), name: "", exercises: [{ id: uid(), name: "", sets: 3, reps: "8-10" }] }); savePlan(); render(); { const last = S.plan.days[S.plan.days.length - 1]; const el = document.getElementById("dn-" + last.id); if (el) { el.scrollIntoView({ block: "center" }); el.focus(); } } break;
    case "exadd": { const d = S.plan.days[+b.dataset.d]; const lastEx = d.exercises[d.exercises.length - 1]; const e2 = { id: uid(), name: "", sets: 3, reps: "8-10" }; if (lastEx && lastEx.block) e2.block = lastEx.block; d.exercises.push(e2); savePlan(); render(); const el = document.getElementById("en-" + e2.id); if (el) el.focus(); break; }
    case "exrm": { const d = S.plan.days[+b.dataset.d]; d.exercises.splice(+b.dataset.e, 1); savePlan(); render(); break; }
    case "exmv": { const d = S.plan.days[+b.dataset.d], i = +b.dataset.e, j = i + +b.dataset.dir; if (j < 0 || j >= d.exercises.length) return; [d.exercises[i], d.exercises[j]] = [d.exercises[j], d.exercises[i]]; savePlan(); render(); break; }
    case "export": exportData(b.dataset.f); break;
    case "saveicon": {
      const bin = atob(APP_ICON.split(",")[1]), bytes = new Uint8Array(bin.length);
      for (let k = 0; k < bin.length; k++) bytes[k] = bin.charCodeAt(k);
      if (!downloads) { saveFile("lift-log-icon.png", new Blob([bytes], { type: "image/png" })); return; }
      downloads.save({ filename: "lift-log-icon.png", data: new Blob([bytes], { type: "image/png" }) })
        .catch(e => { if (e && e.code !== "declined") toast("The icon couldn't be saved here. Press and hold it to save it instead."); });
      break;
    }
  }
});

const msOf = t => S.journey.goals[+t.dataset.g].milestones[+t.dataset.m];
app.addEventListener("input", e => {
  const t = e.target, a = t.dataset.a; if (!a) return;
  memo.clear();
  if (a === "gname") { S.journey.goals[+t.dataset.g].name = t.value; saveJourney(); }
  else if (a === "msname") { msOf(t).name = t.value; saveJourney(); }
  else if (a === "msex") { msOf(t).ex = t.value.trim(); saveJourney(); }
  else if (a === "mstarget") { msOf(t).target = parseNum(t.value) || 0; saveJourney(); }
  else if (a === "bname") { S.journey.benchmarks[+t.dataset.b].name = t.value; saveJourney(); }
  else if (a === "phname") { curPhase().name = t.value; saveJourney(); }
  else if (a === "phfocus") { curPhase().focus = t.value; saveJourney(); }
  else if (a === "coachgoal") S.coach.goal = t.value;
  else if (a === "coachnotes") S.coach.notes = t.value;
  else if (a === "coachdays") { const n = parseInt(t.value, 10); if (n >= 1 && n <= 7) S.coach.days = n; }
  else if (a === "coachmin") { const n = parseInt(t.value, 10); if (n >= 15 && n <= 240) S.coach.minutes = n; }
  else if (a === "npname") S.phaseForm.name = t.value;
  else if (a === "npfocus") S.phaseForm.focus = t.value;
  else if (a === "score") {
    const s = editingSession(); if (!s) return;
    s.exercises[+t.dataset.i].score = t.value; saveSession(s, 900);
  } else if (a === "wtarget") { const n = parseInt(t.value, 10); S.plan.weeklyTarget = n > 0 && n <= 14 ? n : 0; savePlan(); }
  else if (a === "exnote") { S.plan.days[+t.dataset.d].exercises[+t.dataset.e].note = t.value; savePlan(); }
  else if (a === "exrest") { const n = parseInt(t.value, 10); S.plan.days[+t.dataset.d].exercises[+t.dataset.e].rest = n > 0 ? n : 0; savePlan(); }
  else if (a === "w" || a === "r") {
    const s = editingSession(); if (!s) return;
    const st = s.exercises[+t.dataset.i].sets[+t.dataset.j];
    st[a] = a === "r" ? (parseNum(t.value) == null ? null : Math.round(parseNum(t.value))) : parseNum(t.value);
    saveSession(s, 900);
  } else if (a === "dayname") { S.plan.days[+t.dataset.d].name = t.value; savePlan(); }
  else if (a === "exname") { S.plan.days[+t.dataset.d].exercises[+t.dataset.e].name = t.value; savePlan(); }
  else if (a === "exsets") { const n = parseInt(t.value, 10); if (n > 0 && n <= 20) { S.plan.days[+t.dataset.d].exercises[+t.dataset.e].sets = n; savePlan(); } }
  else if (a === "exreps") { S.plan.days[+t.dataset.d].exercises[+t.dataset.e].reps = t.value.trim(); savePlan(); }
});
app.addEventListener("change", e => {
  const t = e.target, a = t.dataset.a;
  memo.clear();
  if (a === "progex") { S.progEx = t.value; ls.set("liftlog.progEx", S.progEx); render(); }
  else if (a === "msex" || a === "mstarget" || a === "msname") scheduleRender();
  else if (a === "msmetric") { msOf(t).metric = t.value; saveJourney(0); render(); }
  else if (a === "bunit") { S.journey.benchmarks[+t.dataset.b].unit = t.value; saveJourney(0); }
  else if (a === "exunit") { const x = S.plan.days[+t.dataset.d].exercises[+t.dataset.e]; if (t.value) x.unit = t.value; else delete x.unit; savePlan(0); }
  else if (a === "npplan") {
    S.phaseForm.plan = t.value;
    if (t.value === "ai" && !(S.coach && S.coach.mode === "new")) openCoach("new");
    render();
  }
  else if (a === "npgoal") { const k = S.phaseForm.keep; if (t.checked) { if (!k.includes(t.value)) k.push(t.value); } else S.phaseForm.keep = k.filter(id => id !== t.value); }
  else if (a === "alias" && t.value) {
    // point the picked name, and anything already counted as it, at this exercise
    const to = canon(t.dataset.to), from = norm(t.value), al = S.journey.aliases;
    if (from !== norm(to)) { for (const k of Object.keys(al)) if (norm(al[k]) === from) al[k] = to; al[from] = to; delete al[norm(to)]; saveJourney(0); toast(`${t.value} now counts as ${to}.`); }
  }
  else if (a === "level") { S.plan.level = t.value; savePlan(0); render(); }
  else if (a === "sdate") { const s = editingSession(); if (s && /^\d{4}-\d{2}-\d{2}$/.test(t.value)) { s.date = t.value; saveSession(s, 0); render(); } }
});
app.addEventListener("keydown", e => {
  const t = e.target;
  if (e.key === "Enter" && t.tagName === "INPUT") {
    if (t.id && t.id.startsWith("addex-")) { e.preventDefault(); t.parentElement.querySelector("button").click(); return; }
    if (t.dataset.a === "w") { e.preventDefault(); const r = document.getElementById(t.id.replace(/^w-/, "r-")); if (r) r.focus(); return; }
    if (t.dataset.a === "r") { e.preventDefault(); t.blur(); }
  }
});
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (["train", "history", "progress", "plan"].includes(h)) { S.view = h; render(); } });

render();
initStore();
// self-hosted copy: cache the app so it opens offline (claude.ai serves its own way)
if (!window.claude && "serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
